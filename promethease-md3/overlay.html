
<!-- BEGIN promethease-md3 1.0.0 -- do not edit inside this block.
     Material Design 3 overhaul (flat / sharp variant) for Promethease
     reports: restyles the stock UI and adds a quick-filter toolbar,
     live counts, a dark theme and a compact card mode.
     Everything above this block is the untouched original report.
     Re-apply or remove with promethease-md3/apply.py. -->
<style id="md3-overhaul" data-md3-version="1.0.0">

/* ---- tokens -------------------------------------------------- */
html[data-md-theme="light"]{
  color-scheme: light;
  --md-primary:#415F91;            --md-on-primary:#FFFFFF;
  --md-primary-container:#D6E3FF;  --md-on-primary-container:#001B3E;
  --md-secondary-container:#DAE2F9;--md-on-secondary-container:#131C2B;
  --md-surface:#F8F9FF;            --md-on-surface:#191C20;
  --md-surface-lowest:#FFFFFF;
  --md-surface-low:#F2F3FA;
  --md-surface-mid:#ECEDF4;
  --md-surface-high:#E6E8EE;
  --md-surface-highest:#E1E2E9;
  --md-on-surface-variant:#43474E;
  --md-outline:#73777F;            --md-outline-variant:#C3C6CF;
  --md-error:#BA1A1A;              --md-error-container:#FFDAD6; --md-on-error-container:#410002;
  --md-good:#1B6B3A;               --md-good-container:#B6F0C6;  --md-on-good-container:#00210E;
  --md-bad:#B3261E;                --md-bad-container:#FFDAD6;   --md-on-bad-container:#410002;
  --md-cbgood:#584399;             --md-cbgood-container:#E6DEFF;--md-on-cbgood-container:#1C0062;
  --md-cbbad:#8B5000;              --md-cbbad-container:#FFDCC1; --md-on-cbbad-container:#2C1600;
  --md-inverse-surface:#2E3036;    --md-inverse-on-surface:#F0F0F7;
  --md-scrim:rgba(0,0,0,.32);
}
html[data-md-theme="dark"]{
  color-scheme: dark;
  --md-primary:#AAC7FF;            --md-on-primary:#0A305F;
  --md-primary-container:#284777;  --md-on-primary-container:#D6E3FF;
  --md-secondary-container:#3E4759;--md-on-secondary-container:#DAE2F9;
  --md-surface:#111318;            --md-on-surface:#E1E2E9;
  --md-surface-lowest:#0C0E13;
  --md-surface-low:#191C20;
  --md-surface-mid:#1D2024;
  --md-surface-high:#282A2F;
  --md-surface-highest:#33353A;
  --md-on-surface-variant:#C3C6CF;
  --md-outline:#8D9199;            --md-outline-variant:#43474E;
  --md-error:#FFB4AB;              --md-error-container:#93000A; --md-on-error-container:#FFDAD6;
  --md-good:#9BD5AB;               --md-good-container:#005225;  --md-on-good-container:#B6F0C6;
  --md-bad:#FFB4AB;                --md-bad-container:#8C1D18;   --md-on-bad-container:#FFDAD6;
  --md-cbgood:#CBBEFF;             --md-cbgood-container:#402C80;--md-on-cbgood-container:#E6DEFF;
  --md-cbbad:#FFB870;              --md-cbbad-container:#693C00;  --md-on-cbbad-container:#FFDCC1;
  --md-inverse-surface:#E1E2E9;    --md-inverse-on-surface:#2E3036;
  --md-scrim:rgba(0,0,0,.6);
}

/* ---- base ---------------------------------------------------- */
html body{
  background:var(--md-surface);
  color:var(--md-on-surface);
  font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.5;
  letter-spacing:.0071em;
  -webkit-font-smoothing:antialiased;
}
html body a{color:var(--md-primary);text-decoration:none}
html body a:hover,html body a:focus{color:var(--md-primary);text-decoration:underline}
html body h1,html body h2,html body h3,html body h4{color:var(--md-on-surface);font-weight:400;letter-spacing:0}
html body hr{border-color:var(--md-outline-variant)}
html body pre,html body code{
  background:var(--md-surface-mid);color:var(--md-on-surface);
  border:1px solid var(--md-outline-variant);border-radius:0
}
::selection{background:var(--md-primary-container);color:var(--md-on-primary-container)}
*:focus-visible{outline:2px solid var(--md-primary);outline-offset:2px}

/* scrollbars */
html body ::-webkit-scrollbar{width:10px;height:10px}
html body ::-webkit-scrollbar-track{background:transparent}
html body ::-webkit-scrollbar-thumb{background:var(--md-outline-variant)}
html body ::-webkit-scrollbar-thumb:hover{background:var(--md-outline)}

/* ---- top app bar --------------------------------------------- */
html body .topnav{background:var(--md-surface);z-index:1030}
html body #navbar.navbar{
  background:var(--md-surface-low)!important;
  border:0!important;border-bottom:1px solid var(--md-outline-variant)!important;
  border-radius:0!important;box-shadow:none!important;
  margin:0!important;padding:0!important;min-height:0
}
html body #navbar .container-fluid{padding:0}
html body #navbar .navbar-header{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px!important;margin:0!important;float:none!important;width:auto!important
}
html body #navbar .navbar-brand{
  float:none!important;height:auto!important;padding:0!important;margin:0!important;
  font-size:20px;font-weight:500;letter-spacing:0;color:var(--md-on-surface)!important;
  order:1;white-space:nowrap
}
html body #navbar form[role="search"]{
  float:none!important;order:2;flex:1 1 0%;min-width:0;width:auto!important;
  padding:0!important;margin:0!important;max-width:none;position:relative
}
html body #navbar form[role="search"] .form-group{margin:0;position:relative}
html body #navbar form[role="search"] .form-group{width:100%}
html body #textfilter.form-control{
  height:44px!important;width:100%!important;box-sizing:border-box!important;
  background:var(--md-surface-high)!important;color:var(--md-on-surface)!important;
  border:1px solid var(--md-outline-variant)!important;border-radius:0!important;
  box-shadow:none!important;margin:0!important;
  padding:0 44px 0 44px;font-size:15px
}
html body #textfilter.form-control::placeholder{color:var(--md-on-surface-variant);opacity:1}
html body #textfilter.form-control:focus{border-color:var(--md-primary)!important;box-shadow:inset 0 0 0 1px var(--md-primary)!important}
.md3-search-icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;fill:var(--md-on-surface-variant);pointer-events:none
}
.md3-search-clear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border:0;background:none;padding:0;cursor:pointer;
  display:none;align-items:center;justify-content:center
}
.md3-search-clear svg{width:18px;height:18px;fill:var(--md-on-surface-variant)}
.md3-search-clear:hover{background:var(--md-surface-highest)}
.md3-search-clear.on{display:flex}

html body #navbar .navbar-header > .pull-right{float:none!important;order:3;display:flex;align-items:center}
html body #pie_div_small{height:36px!important;width:36px!important;float:none!important}
html body #controls-button.navbar-toggle,
html body .md3-iconbtn{
  order:4;float:none!important;margin:0!important;
  width:40px;height:40px;padding:0!important;
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent!important;border:1px solid var(--md-outline-variant)!important;
  border-radius:0!important;box-shadow:none!important;cursor:pointer;color:var(--md-on-surface-variant)
}
html body #controls-button.navbar-toggle:hover,html body .md3-iconbtn:hover{background:var(--md-surface-highest)!important}
html body #controls-button.navbar-toggle .fa{font-size:16px;color:var(--md-on-surface-variant)}
.md3-iconbtn svg{width:20px;height:20px;fill:currentColor}

/* tabs */
html body #main-tab{background:var(--md-surface-low)}
html body #main-tab .nav-tabs{
  border-bottom:1px solid var(--md-outline-variant);
  padding:0 12px;margin:0;display:flex;gap:4px
}
html body #main-tab .nav-tabs > li{float:none;margin:0}
html body #main-tab .nav-tabs > li > a{
  border:0!important;border-radius:0!important;background:transparent!important;
  color:var(--md-on-surface-variant)!important;
  padding:12px 16px!important;margin:0!important;
  font-size:14px;font-weight:500;letter-spacing:.006em;
  border-bottom:3px solid transparent!important
}
html body #main-tab .nav-tabs > li > a:hover{background:var(--md-surface-mid)!important;color:var(--md-on-surface)!important}
html body #main-tab .nav-tabs > li.active > a{
  color:var(--md-primary)!important;border-bottom-color:var(--md-primary)!important;background:transparent!important
}

/* ---- quick filter toolbar (added) ---------------------------- */
#md3-toolbar{
  background:var(--md-surface-low);
  border-bottom:1px solid var(--md-outline-variant);
  padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px
}
#md3-count{
  font-size:13px;color:var(--md-on-surface-variant);
  margin-right:4px;white-space:nowrap
}
#md3-count b{color:var(--md-on-surface);font-weight:500}
.md3-chip{
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 12px;
  background:transparent;color:var(--md-on-surface-variant);
  border:1px solid var(--md-outline);border-radius:0;
  font-size:13px;font-weight:500;letter-spacing:.006em;
  cursor:pointer;white-space:nowrap;font-family:inherit
}
.md3-chip:hover{background:var(--md-surface-highest)}
.md3-chip svg{width:16px;height:16px;fill:currentColor;display:none}
.md3-chip em{font-style:normal;opacity:.65;margin-left:6px;font-variant-numeric:tabular-nums}
.md3-chip[aria-pressed="true"]{
  background:var(--md-secondary-container);color:var(--md-on-secondary-container);
  border-color:var(--md-secondary-container);padding-left:8px
}
.md3-chip[aria-pressed="true"] svg{display:block}
.md3-chip.md3-chip-good[aria-pressed="true"]{background:var(--md-good-container);color:var(--md-on-good-container);border-color:var(--md-good-container)}
.md3-chip.md3-chip-bad[aria-pressed="true"]{background:var(--md-bad-container);color:var(--md-on-bad-container);border-color:var(--md-bad-container)}
.md3-spacer{flex:1 1 auto}
.md3-textbtn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
  background:transparent;border:0;color:var(--md-primary);
  font-size:13px;font-weight:500;cursor:pointer;font-family:inherit
}
.md3-textbtn:hover{background:var(--md-surface-highest)}
.md3-textbtn svg{width:18px;height:18px;fill:currentColor}

/* ---- content column ------------------------------------------ */
html body .tab-contents{margin-top:var(--md-topnav-h,150px)!important}
html body div[role="tabpanel"] > .tab-content{padding:0 16px 64px}
html body .tab-pane > .row{margin:0}
html body .tab-pane > .row > .col-sm-12{padding:0}

/* ---- geno cards ---------------------------------------------- */
html body .noRepute,html body .badRepute,html body .goodRepute,
html body .badRepute_cb,html body .goodRepute_cb{
  --md-accent:var(--md-outline-variant);
  --md-accent-on:var(--md-on-surface-variant);
  background:var(--md-surface-low)!important;
  border:1px solid var(--md-outline-variant)!important;
  border-left:4px solid var(--md-accent)!important;
  border-radius:0!important;box-shadow:none!important;
  padding:16px 20px!important;margin:0 0 12px 0!important
}
html body .noRepute:hover,html body .badRepute:hover,html body .goodRepute:hover,
html body .badRepute_cb:hover,html body .goodRepute_cb:hover{
  box-shadow:none!important;background:var(--md-surface-mid)!important
}
html body .goodRepute{--md-accent:var(--md-good);--md-accent-on:var(--md-good)}
html body .badRepute{--md-accent:var(--md-bad);--md-accent-on:var(--md-bad)}
html body .goodRepute_cb{--md-accent:var(--md-cbgood);--md-accent-on:var(--md-cbgood)}
html body .badRepute_cb{--md-accent:var(--md-cbbad);--md-accent-on:var(--md-cbbad)}

html body .boxresult.row{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) minmax(200px,300px);
  column-gap:28px;row-gap:4px;margin:0!important
}
html body .boxresult > .boxlink,
html body .boxresult > .boxfreq,
html body .boxresult > .md3-cardhead,
html body .boxresult > .col-xs-12:not(.boxresultcol1):not(.boxresultcol2),
html body .boxresult > #footerBox{grid-column:1/-1}
html body .boxresult > .boxresultcol1{grid-column:1;width:auto!important;float:none!important;padding:0!important;min-width:0}
html body .boxresult > .boxresultcol2{grid-column:2;width:auto!important;float:none!important;padding:0!important;min-width:0}
html body .boxresult > .col-xs-12:not(.boxresultcol1):not(.boxresultcol2){
  width:auto!important;float:none!important;padding:0!important
}
@media (max-width:900px){
  html body .boxresult.row{grid-template-columns:minmax(0,1fr)}
  html body .boxresult > .boxresultcol1,html body .boxresult > .boxresultcol2{grid-column:1}
}

/* card head: id + genotype + status chips */
.md3-cardhead{
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  margin:0 0 10px;padding-bottom:10px;
  border-bottom:1px solid var(--md-outline-variant)
}
.md3-cardhead .md3-id{font-size:16px;font-weight:500;letter-spacing:0}
.md3-cardhead .md3-id a{color:var(--md-on-surface)}
.md3-geno{
  display:inline-flex;align-items:center;height:24px;padding:0 8px;
  border:1px solid var(--md-outline-variant);
  font-family:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;color:var(--md-on-surface-variant)!important;background:var(--md-surface-mid)
}
.md3-geno:hover{text-decoration:none!important;background:var(--md-surface-highest)}
.md3-badge{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;
  font-size:12px;font-weight:500;letter-spacing:.02em;
  background:var(--md-surface-highest);color:var(--md-on-surface-variant)
}
.md3-badge-good{background:var(--md-good-container);color:var(--md-on-good-container)}
.md3-badge-bad{background:var(--md-bad-container);color:var(--md-on-bad-container)}
.md3-badge-cbgood{background:var(--md-cbgood-container);color:var(--md-on-cbgood-container)}
.md3-badge-cbbad{background:var(--md-cbbad-container);color:var(--md-on-cbbad-container)}
.md3-badge-hi{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.md3-badge svg{width:14px;height:14px;fill:currentColor}
.md3-dots{display:inline-flex;gap:2px;margin-left:1px}
.md3-dots i{width:4px;height:12px;background:currentColor;opacity:.28;display:block}
.md3-dots i.on{opacity:1}

/* card body text */
html body .boxeffect,html body .gsboxeffect{
  color:var(--md-on-surface-variant)!important;font-size:14px;line-height:1.6
}
html body .boxeffect b,html body .gsboxeffect b{color:var(--md-on-surface)!important;font-weight:500}
html body .genoimage{max-height:220px;width:auto;margin:0 0 12px;border:1px solid var(--md-outline-variant)}
html body div.rstext{
  background:var(--md-surface-mid)!important;color:var(--md-on-surface-variant)!important;
  border:1px solid var(--md-outline-variant);border-radius:0;
  margin-top:12px!important;padding:12px 14px!important;font-size:13px;line-height:1.6
}
/* the stat table reuses .rstext on <tr>; keep those as plain rows */
html body tr.rstext,html body tr.rstext > td{
  background:none!important;border-radius:0;margin:0!important;padding:7px 0!important;font-size:inherit
}
html body .counselorwarning{
  background:var(--md-error-container)!important;color:var(--md-on-error-container)!important;
  border:0;border-left:4px solid var(--md-error);border-radius:0;
  margin-top:12px!important;padding:12px 14px!important;font-size:13px
}
html body .mgcbox{
  background:var(--md-secondary-container)!important;color:var(--md-on-secondary-container)!important;
  border-radius:0;padding:12px 14px!important;margin-top:12px!important
}
html body .mgcbox .link-button{color:var(--md-primary);text-decoration:underline}

/* clamp long descriptions (only cards actually measured as overflowing) */
body.md3-compact .boxresult.md3-clamped:not(.md3-expanded) .md3-clampable{
  max-height:11em;overflow:hidden;position:relative
}
body.md3-compact .boxresult.md3-clamped:not(.md3-expanded) .md3-clampable::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3em;
  background:linear-gradient(to bottom,transparent,var(--md-surface-low))
}
body.md3-compact .boxresult.md3-clamped:hover:not(.md3-expanded) .md3-clampable::after{
  background:linear-gradient(to bottom,transparent,var(--md-surface-mid))
}
.md3-more{
  display:none;align-items:center;gap:4px;margin-top:6px;padding:4px 8px 4px 4px;
  background:none;border:0;color:var(--md-primary);
  font-family:inherit;font-size:13px;font-weight:500;cursor:pointer
}
body.md3-compact .boxresult.md3-clamped .md3-more{display:inline-flex}
.md3-more svg{width:18px;height:18px;fill:currentColor}
.md3-expanded .md3-more svg{transform:rotate(180deg)}

/* stat table -> label/value grid (label first, value right) */
html body .boxresultcol2 > .table{margin:0;background:none;border:0}
html body .boxresultcol2 > .table > tbody > tr{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;
  column-gap:12px;border-top:1px solid var(--md-outline-variant)
}
html body .boxresultcol2 > .table > tbody > tr:first-child{border-top:0}
html body .boxresultcol2 > .table > tbody > tr > td{
  border:0!important;padding:7px 0!important;background:none!important;vertical-align:baseline
}
html body .boxresultcol2 > .table > tbody > tr > td:first-child{
  order:2;text-align:right;font-weight:500;color:var(--md-on-surface);font-variant-numeric:tabular-nums
}
html body .boxresultcol2 > .table > tbody > tr > td:nth-child(2){order:1;color:var(--md-on-surface-variant)}
html body .boxresultcol2 > .table > tbody > tr > td[colspan="2"]{grid-column:1/-1;order:1;text-align:left}
html body .boxresultcol2 .controllabel,
html body .boxresultcol2 .comparegenolabel{
  font-weight:400;font-size:13px;color:var(--md-on-surface-variant);margin:0;
  border-bottom:1px dotted var(--md-outline-variant);cursor:help
}
html body tr.md3-hide{display:none!important}

/* population frequency bars (chartist) */
html body .ct-label{
  fill:var(--md-on-surface-variant)!important;color:var(--md-on-surface-variant)!important;
  font-size:10px;line-height:1
}
html body .ct-series-a .ct-bar{stroke:var(--md-outline-variant)!important;opacity:.9}
html body .ct-series-b .ct-bar{stroke:var(--md-outline)!important;opacity:.9}
html body .ct-series-c .ct-bar{stroke:var(--md-primary)!important;opacity:.55}
html body .ct-series-a-active .ct-bar,
html body .ct-series-b-active .ct-bar,
html body .ct-series-c-active .ct-bar{stroke:var(--md-on-surface)!important;opacity:1}
html body .ct-grid{stroke:var(--md-outline-variant)!important}
html body .chartist-tooltip{
  background:var(--md-inverse-surface)!important;color:var(--md-inverse-on-surface)!important;
  border-radius:0!important;box-shadow:none!important;font-size:12px
}

/* empty state */
#md3-empty{
  border:1px solid var(--md-outline-variant);background:var(--md-surface-low);
  padding:40px 24px;text-align:center;color:var(--md-on-surface-variant)
}
#md3-empty b{display:block;font-size:16px;font-weight:500;color:var(--md-on-surface);margin-bottom:6px}

/* tag chips */
html body .boxresult > .col-xs-12:not(.boxresultcol1):not(.boxresultcol2){
  margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px
}
html body .linkedtolabel,html body #tags > label{
  font-size:11px!important;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  color:var(--md-on-surface-variant);margin:0 4px 0 0
}
html body .linkedtolabel .fa{display:none}
html body a.label,html body a.label-info,html body .label,html body .label-info{
  display:inline-flex;align-items:center;height:26px;padding:0 10px;
  background:var(--md-surface-mid)!important;color:var(--md-on-surface-variant)!important;
  border:1px solid var(--md-outline-variant);border-radius:0!important;
  font-size:12px;font-weight:400;white-space:nowrap
}
html body a.label:hover,html body a.label-info:hover{
  background:var(--md-secondary-container)!important;color:var(--md-on-secondary-container)!important;
  border-color:var(--md-secondary-container);text-decoration:none!important
}

/* footer "show more" */
html body #footerBox{margin:8px 0 0!important}
html body #footerBox .boxresult{display:block!important;padding:0!important}
html body #footerBox #more.btn{
  display:block;width:100%;height:44px;
  background:var(--md-secondary-container)!important;color:var(--md-on-secondary-container)!important;
  border:0!important;border-radius:0!important;box-shadow:none!important;text-shadow:none!important;
  font-size:14px;font-weight:500;letter-spacing:.006em
}
html body #footerBox #more.btn:hover{filter:brightness(.96)}

/* ---- side drawer --------------------------------------------- */
html body #controls{
  background:var(--md-surface-low)!important;
  border-left:1px solid var(--md-outline-variant);
  padding:0 0 32px!important;
  color:var(--md-on-surface);
  /* above the fixed app bar (1030), below Bootstrap's modal backdrop (1040) */
  z-index:1035
}
html body #controls #btn_controls_close{
  position:absolute;top:8px;right:10px;z-index:2;
  opacity:1;color:var(--md-on-surface-variant);text-shadow:none;
  font-size:22px;font-weight:400;width:32px;height:32px;line-height:1
}
html body #controls #btn_controls_close:hover{background:var(--md-surface-highest)}
.md3-drawer-title{
  display:block;padding:14px 16px 12px;
  border-bottom:1px solid var(--md-outline-variant);
  font-size:16px;font-weight:500;color:var(--md-on-surface)
}
html body #controls .aside-btn-xs{
  display:flex;flex-wrap:wrap;gap:0;margin:0!important;
  padding:8px 12px;border-bottom:1px solid var(--md-outline-variant)
}
html body #controls .aside-btn-xs .btn{

  /* ---------- per-card enhancement ---------- */
  var LABELS_TO_LIFT = {'Repute':1, 'Magnitude':1};

  function reputeOf(card){
    var w = card.parentNode;
    if(!w || !w.className) return 'none';
    if(/goodRepute_cb/.test(w.className)) return 'cbgood';
    if(/badRepute_cb/.test(w.className))  return 'cbbad';
    if(/goodRepute/.test(w.className))    return 'good';
    if(/badRepute/.test(w.className))     return 'bad';
    return 'none';
  }

  function magDots(mag){
    var n = Math.max(0, Math.min(4, Math.round(mag)));
    var out = '<span class="md3-dots">';
    for(var i=0;i<4;i++) out += '<i class="'+(i<n?'on':'')+'"></i>';
    return out + '</span>';
  }

  function enhanceCard(card){
    if(card.dataset.md3) return;
    // the "show more" footer reuses .boxresult but is not a variant
    if(card.closest && card.closest('#footerBox')) return;
    card.dataset.md3 = '1';

    // pull the key stats out of the value/label table
    var stats = {};
    var rows = card.querySelectorAll('.boxresultcol2 > table > tbody > tr');
    Array.prototype.forEach.call(rows, function(tr){
      var tds = tr.children;
      if(tds.length < 2) return;
      var label = (tds[1].textContent || '').trim();
      var value = (tds[0].textContent || '').trim();
      if(!label) return;
      if(stats[label] === undefined) stats[label] = value;
      if(LABELS_TO_LIFT[label]) tr.classList.add('md3-hide');
    });

    // header row: identifier, genotype, status badges
    var head = el('div','md3-cardhead');
    var linkbox = card.querySelector('.boxlink');
    if(linkbox){
      var snp = linkbox.querySelector('.snplink') || linkbox.querySelector('a');
      var geno = linkbox.querySelector('.snpgenolink');
      var id = el('span','md3-id');
      if(snp) id.appendChild(snp);
      head.appendChild(id);
      if(geno){ geno.classList.add('md3-geno'); head.appendChild(geno); }
      var holder = linkbox.parentNode;
      linkbox.parentNode.removeChild(linkbox);
      if(holder && holder.classList.contains('boxfreq') && !holder.children.length){
        holder.parentNode.removeChild(holder);
      }
    }

    var rep = reputeOf(card);
    if(rep !== 'none'){
      var repText = stats['Repute'] || (rep.indexOf('good') > -1 ? 'Good' : 'Bad');
      var good = rep.indexOf('good') > -1;
      head.appendChild(el('span','md3-badge md3-badge-'+rep,
        svg(good ? 'good' : 'bad') + '<span>' + repText + '</span>'));
    } else if(stats['Repute']){
      head.appendChild(el('span','md3-badge','<span>'+stats['Repute']+'</span>'));
    } else {
      head.appendChild(el('span','md3-badge','<span>Not set</span>'));
    }

    if(stats['Magnitude'] !== undefined && stats['Magnitude'] !== ''){
      var mag = parseFloat(stats['Magnitude']);
      if(!isNaN(mag)){
        head.appendChild(el('span','md3-badge'+(mag>=4?' md3-badge-hi':''),
          '<span>Magnitude ' + stats['Magnitude'] + '</span>' + magDots(mag)));
      }
    }
    if(stats['ClinVar Significance']){
      head.appendChild(el('span','md3-badge','<span>ClinVar: '+stats['ClinVar Significance']+'</span>'));
    }
    card.insertBefore(head, card.firstChild);

    // hide the broken SNPedia thumbnails this report ships with
    Array.prototype.forEach.call(card.querySelectorAll('img.genoimage'), function(img){
      if(img.complete && img.naturalWidth === 0) img.style.display = 'none';
      img.addEventListener('error', function(){ img.style.display = 'none'; });
    });

    // clamp long descriptions behind a Show more control
    var body = card.querySelector('.boxeffect, .gsboxeffect');
    if(body){
      body.classList.add('md3-clampable');
      var more = el('button','md3-more', svg('chevron')+'<span>Show more</span>');
      more.type = 'button';
      more.addEventListener('click', function(){
        var open = card.classList.toggle('md3-expanded');
        more.querySelector('span').textContent = open ? 'Show less' : 'Show more';
      });
      body.parentNode.insertBefore(more, body.nextSibling);
    }
  }

  // A card only gets the clamp if its description is genuinely taller than the
  // cap; measured with the clamp off so the reading is the natural height.
  function measureClamps(){
    var list = document.getElementById('genoslist');
    if(!list) return;
    Array.prototype.forEach.call(list.querySelectorAll('.boxresult .md3-clampable'), function(body){
      var card = body.closest ? body.closest('.boxresult') : null;
      if(!card) return;
      var wasClamped = card.classList.contains('md3-clamped');
      card.classList.remove('md3-clamped');
      var cap = parseFloat(getComputedStyle(body).fontSize) * 11;
      var tall = body.getBoundingClientRect().height > cap + 8;
      card.classList.toggle('md3-clamped', tall);
      if(!tall && wasClamped) card.classList.remove('md3-expanded');
    });
  }

  function enhanceAll(){
    var list = document.getElementById('genoslist');
    if(!list) return;
    Array.prototype.forEach.call(list.querySelectorAll('.boxresult'), enhanceCard);

    // empty state instead of a blank page
    var empty = document.getElementById('md3-empty');
    if(!list.querySelector('.boxresult')){
      if(!empty){
        empty = el('div',null,
          '<b>Nothing matches these filters</b>' +
          'Widen the magnitude range, re-enable a repute, or clear the search box.');
        empty.id = 'md3-empty';
        list.appendChild(empty);
      }
    } else if(empty){
      empty.parentNode.removeChild(empty);
    }

    var moreBtn = document.querySelector('#footerBox #more');
    if(moreBtn){
      var hidden = parseInt($('#num_missed').val(), 10) || 0;
      moreBtn.textContent = hidden
        ? 'Show more results (' + num(hidden) + ' more match)'
        : 'Show more results';
      moreBtn.classList.remove('btn-default');
    }
  }

  function refresh(){ enhanceAll(); measureClamps(); syncCount(); syncChips(); }

  /* ---------- hook the report's own render calls ---------- */
  function wrap(name, after){
    var orig = window[name];
    if(typeof orig !== 'function' || orig.__md3) return;
    var fn = function(){
      var r = orig.apply(this, arguments);
      try{ after(); }catch(e){ /* never break the report */ }
      return r;
    };
    fn.__md3 = true;
    window[name] = fn;
  }
  wrap('updateTable', refresh);
  wrap('updateGenos', function(){ syncCount(); syncChips(); });
  wrap('pagesetup', function(){ buildAppBar(); sizeContent(); refresh(); });
  wrap('resetControls', function(){ setTimeout(function(){ syncChips(); syncCount(); }, 0); });

  // belt and braces: anything that rewrites the list gets picked up
  var mo = new MutationObserver(function(){
    if(mo.__busy) return;
    mo.__busy = true;
    requestAnimationFrame(function(){ mo.__busy = false; refresh(); });
  });

  /* ---------- keep content clear of the fixed app bar and drawer ---------- */
  function sizeContent(){
    var nav = document.querySelector('.topnav');
    if(nav){
      var h = nav.getBoundingClientRect().height;
      if(h > 0) document.documentElement.style.setProperty('--md-topnav-h', Math.round(h + 12) + 'px');
    }
    // The stock report puts the tab panel outside #main, so the offcanvas
    // drawer never pushes it and covers the cards below ~1200px. Reserve the
    // overlap ourselves.
    var panel = document.querySelector('div[role="tabpanel"] > .tab-content');
    var drawer = document.getElementById('controls');
    if(!panel) return;
    var pad = 16;
    if(drawer && drawer.classList.contains('in')){
      var overlap = panel.getBoundingClientRect().right - drawer.getBoundingClientRect().left;
      if(overlap > 0) pad += Math.round(overlap);
    }
    panel.style.paddingRight = pad + 'px';
  }

  /* ---------- the filters only apply to the variant list ---------- */
  function syncTabChrome(){
    var main = document.querySelector('#myTab li.active > a');
    var onMain = !main || main.getAttribute('href') === '#tab-ui2';
    var bar = document.getElementById('md3-toolbar');
    var drawerBtn = document.getElementById('controls-button');
    if(bar) bar.style.display = onMain ? '' : 'none';
    if(drawerBtn) drawerBtn.style.visibility = onMain ? '' : 'hidden';
    sizeContent();
  }

  /* ---------- drawer heading ---------- */
  function buildDrawer(){
    var controls = document.getElementById('controls');
    if(!controls || controls.querySelector('.md3-drawer-title')) return;
    var title = el('span','md3-drawer-title','Filters');
    controls.insertBefore(title, controls.firstChild);
    var close = document.getElementById('btn_controls_close');
    if(close){ close.title = 'Hide filters'; close.setAttribute('aria-label','Hide filters'); }
  }

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', function(e){
    var t = e.target || {};
    var typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName || '') || t.isContentEditable;
    if(e.key === '/' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){
      var f = document.getElementById('textfilter');
      if(f){ e.preventDefault(); f.focus(); f.select(); }
    }
  });

  /* ---------- boot ---------- */
  $(document).ready(function(){
    buildAppBar();
    buildToolbar();
    buildDrawer();
    sizeContent();
    refresh();
    syncTabChrome();
    $('#myTab a[data-toggle="tab"]').on('shown.bs.tab', syncTabChrome);
    $('#controls').on('shown.bs.offcanvas hidden.bs.offcanvas', function(){
      setTimeout(sizeContent, 0);
    });
    var list = document.getElementById('genoslist');
    if(list) mo.observe(list, {childList:true});
    $(window).on('resize', sizeContent);
    // the report resizes/repaints a few times right after load
    [60, 300, 1200].forEach(function(ms){ setTimeout(function(){ sizeContent(); refresh(); }, ms); });
  });
})();
