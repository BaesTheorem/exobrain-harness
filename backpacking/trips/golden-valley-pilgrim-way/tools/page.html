<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Golden Valley Pilgrim Way: 8 nights in church sanctuaries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0&icon_names=bed,castle,church,download,fort,layers,landscape,water_drop,account_balance,hiking,arrow_upward,info" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
:root{--blue:#012FFF;--lime:#E1FF4F;--ink:#111418;--g1:#F3F4F6;--g2:#D9DCE1;--g3:#6B7280;--card:rgba(255,255,255,.86)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Outfit,system-ui,sans-serif;color:var(--ink);background:var(--g1)}
.ms{font-family:'Material Symbols Outlined';font-size:18px;line-height:1;vertical-align:-3px}
#app{display:grid;grid-template-columns:400px 1fr;height:100vh}
#panel{overflow:auto;padding:24px;background:var(--g1)}
#map{height:100%}
h1{font-weight:300;font-size:30px;line-height:1.1;margin:0 0 4px}
.sub{color:var(--g3);font-size:14px;margin-bottom:16px}
.stats{display:flex;gap:16px;margin:12px 0 16px}
.stat b{display:block;font-weight:200;font-size:36px;line-height:1}.stat span{font-size:12px;color:var(--g3);text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tab{border:1px solid var(--g2);background:#fff;border-radius:999px;padding:6px 12px;font:500 13px Outfit;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--g2);border-radius:16px;padding:16px;margin-bottom:12px;backdrop-filter:blur(8px)}
.card h2{font-weight:500;font-size:17px;margin:0 0 2px}
.eyebrow{font-size:12px;color:var(--g3);text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--g1);border-radius:999px;padding:4px 10px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
ul{padding-left:0;margin:8px 0;list-style:none}li{padding:6px 0;border-top:1px solid var(--g1);font-size:14px;display:flex;gap:8px}
li .km{color:var(--g3);min-width:46px;font-variant-numeric:tabular-nums}
.tag{font-size:11px;background:var(--lime);border-radius:4px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.tag.opt{background:var(--g2)}
.note{font-size:13px;color:#374151;line-height:1.45}
svg.prof{width:100%;height:96px;display:block;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;text-decoration:none;border-radius:999px;padding:8px 14px;font:500 13px Outfit}
.mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--ink);cursor:pointer}
.mk .ms{font-size:16px}
.mk.sanctuary{background:var(--ink);color:var(--lime);border-color:var(--lime)}
.mk.castle,.mk.ruin,.mk.ancient{background:var(--blue);color:#fff;border-color:#fff}
.mk.well{background:#fff;color:var(--blue);border-color:var(--blue)}
.mk.dim{opacity:.35}
#layer{position:absolute;top:12px;right:12px;z-index:2}
.maplibregl-popup-content{font-family:Outfit;border-radius:12px;padding:10px 12px;font-size:13px;max-width:260px}
.legend{font-size:12px;color:var(--g3);display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.src{font-size:12px;color:var(--g3);line-height:1.5}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}#mapwrap{order:-1}#map{height:55vh}.mk{width:22px;height:22px}.mk .ms{font-size:13px}#panel{padding:16px}}
</style>
</head>
<body>
<div id="app">
  <div id="panel"></div>
  <div id="mapwrap" style="position:relative"><div id="map"></div><button id="layer" class="tab"><span class="ms">layers</span> Satellite</button></div>
</div>
<script>
const D=/*DATA*/null;
const DAYC=["#012FFF","#7C3AED","#DB2777","#EA580C","#16A34A","#0891B2","#CA8A04","#4B5563"];
const ICON={sanctuary:"bed",castle:"castle",ruin:"account_balance",ancient:"landscape",church:"church",well:"water_drop"};
const LABEL={sanctuary:"Night sanctuary",castle:"Castle",ruin:"Ruin",ancient:"Neolithic",church:"Church",well:"Holy well"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur=-1;
const totKm=D.days.reduce((a,d)=>a+d.km,0), sideKm=D.days.reduce((a,d)=>a+d.side_km,0), totUp=D.days.reduce((a,d)=>a+d.up,0);

function prof(d,col){
  const p=d.profile, W=352,H=96,pl=40,pb=16;
  const xm=Math.max(...p.map(q=>q[0])), ys=p.map(q=>q[1]), y0=0, y1=Math.ceil(Math.max(...ys,400)/100)*100;
  const X=x=>pl+(W-pl-4)*x/xm, Y=y=>(H-pb)-(H-pb-6)*(y-y0)/(y1-y0);
  const path=p.map((q,i)=>(i?"L":"M")+X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1)).join("");
  return `<svg class="prof" viewBox="0 0 ${W} ${H}" role="img" aria-label="Elevation profile">
  <line x1="${pl}" x2="${W}" y1="${Y(y1)}" y2="${Y(y1)}" stroke="#E5E7EB"/><line x1="${pl}" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#D9DCE1"/>
  <text x="${pl-4}" y="${Y(y1)+4}" font-size="10" text-anchor="end" fill="#6B7280">${y1} m</text><text x="${pl-4}" y="${Y(0)+3}" font-size="10" text-anchor="end" fill="#6B7280">0</text>
  <text x="${W}" y="${H-2}" font-size="10" text-anchor="end" fill="#6B7280">${xm.toFixed(1)} km</text>
  <path d="${path}L${X(xm)},${Y(0)}L${X(0)},${Y(0)}Z" fill="${col}" fill-opacity=".12"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2"/></svg>`;
}
function dayCard(d,i){
  const col=DAYC[i%DAYC.length];
  const stops=d.stops.map(s=>{const x=D.sites.find(q=>q.id===s.id)||{};const tg=s.side?`<span class="tag">Detour ${s.side}</span>`:(s.opt?`<span class="tag opt">Optional</span>`:"");
    return `<li><span class="km">${s.at??""}</span><span><span class="ms">${ICON[x.kind]||"info"}</span> ${esc(x.name||s.id)}${tg}<br><span class="note">${esc(s.text||"")}</span></span></li>`}).join("");
  return `<div class="card"><div class="eyebrow" style="color:${col}">Day ${i+1}</div><h2>${esc(d.title)}</h2>
  <div class="chips"><span class="chip"><span class="ms">hiking</span>${d.km.toFixed(1)} km on route</span>${d.side_km?`<span class="chip">+${d.side_km.toFixed(1)} km detours</span>`:""}<span class="chip"><span class="ms">arrow_upward</span>${d.up} m</span><span class="chip"><span class="ms">bed</span>${esc(d.sleep)}</span></div>
  ${prof(d,col)}<ul>${stops}</ul>${d.note?`<div class="note">${esc(d.note)}</div>`:""}</div>`;
}
function render(){
  const tabs=`<div class="tabs"><button class="tab ${cur<0?"on":""}" data-i="-1">All</button>${D.days.map((d,i)=>`<button class="tab ${cur===i?"on":""}" data-i="${i}">Day ${i+1}</button>`).join("")}</div>`;
  const head=`<div class="eyebrow">Herefordshire · Welsh Marches</div><h1>Golden Valley Pilgrim Way</h1>
  <div class="sub">${esc(D.meta.subtitle)}</div>
  <div class="stats"><div class="stat"><b>${(totKm+sideKm).toFixed(0)}</b><span>km total</span></div><div class="stat"><b>${D.days.length}</b><span>walking days</span></div><div class="stat"><b>${totUp}</b><span>m climb (low est.)</span></div></div>
  <div class="legend"><span><span class="dot" style="background:var(--ink);outline:2px solid var(--lime)"></span> sleep</span><span><span class="dot" style="background:var(--blue)"></span> castle, ruin, tomb</span><span><span class="dot" style="border:2px solid var(--blue)"></span> church or well</span><span><span class="dot" style="background:var(--lime);outline:2px solid var(--ink);border-radius:2px"></span> detour, out and back</span></div>`;
  const body = cur<0 ? `<div class="card"><h2>The plan</h2><div class="note">${D.meta.overview}</div><div style="margin-top:12px"><a class="btn" href="gvpw-8-night.gpx" download><span class="ms">download</span>GPX for your phone</a></div></div>`
     + D.days.map((d,i)=>`<div class="card" style="cursor:pointer" data-go="${i}"><div class="eyebrow" style="color:${DAYC[i]}">Day ${i+1}</div><h2>${esc(d.title)}</h2><div class="chips"><span class="chip">${(d.km+d.side_km).toFixed(1)} km</span><span class="chip">+${d.up} m</span><span class="chip"><span class="ms">bed</span>${esc(d.sleep)}</span></div></div>`).join("")
     + `<div class="card"><h2>Before you go</h2><div class="note">${D.meta.before}</div></div><div class="card src">${D.meta.sources}</div>`
     : dayCard(D.days[cur],cur);
  document.getElementById("panel").innerHTML=head+tabs+body;
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>go(+b.dataset.i));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
}
const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",bounds:[[-3.09,51.91],[-2.70,52.10]],fitBoundsOptions:{padding:40},attributionControl:{compact:true}});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
const markers=[];
map.on("load",()=>{
  map.addSource("sat",{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,attribution:"Imagery © Esri, Maxar, Earthstar Geographics"});
  map.addLayer({id:"sat",type:"raster",source:"sat",layout:{visibility:"none"}});
  D.days.forEach((d,i)=>{
    map.addSource("d"+i,{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:d.line}}});
    map.addLayer({id:"d"+i+"c",type:"line",source:"d"+i,paint:{"line-color":"#fff","line-width":7,"line-opacity":.9},layout:{"line-cap":"round","line-join":"round"}});
    map.addLayer({id:"d"+i,type:"line",source:"d"+i,paint:{"line-color":DAYC[i],"line-width":4},layout:{"line-cap":"round","line-join":"round"}});
  });
  Object.entries(D.side).forEach(([k,v])=>{
    const opt=D.optional_side.includes(k);
    map.addSource("s_"+k,{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:v.out}}});
    map.addLayer({id:"s_"+k+"c",type:"line",source:"s_"+k,paint:{"line-color":"#111418","line-width":6}});
    map.addLayer({id:"s_"+k,type:"line",source:"s_"+k,paint:{"line-color":opt?"#D9DCE1":"#E1FF4F","line-width":3.5,"line-dasharray":[1.5,1.5]}});
  });
  D.sites.forEach(s=>{
    const el=document.createElement("div");el.className="mk "+s.kind;el.innerHTML=`<span class="ms">${ICON[s.kind]||"info"}</span>`;
    const pop=new maplibregl.Popup({offset:16}).setHTML(`<b>${esc(s.name)}</b><br><span style="color:#6B7280">${LABEL[s.kind]||""}${s.approx?" · position approximate":""}</span>${s.blurb?`<br>${esc(s.blurb)}`:""}`);
    markers.push({s,m:new maplibregl.Marker({element:el}).setLngLat([s.lon,s.lat]).setPopup(pop).addTo(map),el});
  });
});
function go(i){
  cur=i;render();
  D.days.forEach((d,j)=>{const on=i<0||i===j;["d"+j,"d"+j+"c"].forEach(l=>map.getLayer(l)&&map.setPaintProperty(l,"line-opacity",on?(l.endsWith("c")?.9:1):.15));});
  const ids=i<0?null:new Set(D.days[i].stops.map(s=>s.id).concat([D.days[i].from,D.days[i].to]));
  markers.forEach(({s,el})=>el.classList.toggle("dim",!!ids&&!ids.has(s.id)));
  const pts=i<0?D.days.flatMap(d=>d.line):D.days[i].line.concat(...(D.days[i].side||[]).map(k=>D.side[k]?.line||[]));
  const b=pts.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(pts[0],pts[0]));
  map.fitBounds(b,{padding:50,duration:600});
}
document.getElementById("layer").onclick=e=>{const v=map.getLayoutProperty("sat","visibility")==="none";map.setLayoutProperty("sat","visibility",v?"visible":"none");e.currentTarget.classList.toggle("on",v);};
render();
</script>
</body>
</html>
