<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FB Cleaner</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color-scheme: light dark;
      }
      body {
        width: 220px;
        margin: 0;
        padding: 14px 16px;
        background: Canvas;
        color: CanvasText;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      .status {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 2px;
      }
      .status.on { color: #2e7d32; }
      .status.off { color: #c62828; }

      /* iOS-style toggle */
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }
      .switch input { display: none; }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #bbb;
        border-radius: 22px;
        transition: 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 2px;
        top: 2px;
        background: #fff;
        border-radius: 50%;
        transition: 0.2s;
      }
      input:checked + .slider { background: #2e7d32; }
      input:checked + .slider::before { transform: translateX(18px); }

      .hint {
        margin-top: 10px;
        font-size: 11px;
        opacity: 0.6;
        line-height: 1.4;
      }
      .section {
        margin-top: 14px;
        border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
        padding-top: 12px;
      }
      .section label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-size: 12px;
        padding: 6px 8px;
        border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-radius: 6px;
        background: Canvas;
        color: CanvasText;
        resize: vertical;
        min-height: 80px;
      }
      .saved {
        font-size: 10px;
        opacity: 0;
        transition: opacity 0.2s;
        margin-top: 4px;
      }
      .saved.show { opacity: 0.6; }
    </style>
  </head>
  <body>
    <div class="row">
      <div>
        <h1>FB Cleaner</h1>
        <div id="status" class="status">…</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="hint">Blocks Reels, Stories, Sponsored posts, and suggested posts from Pages/Groups you don't follow.</div>
    <div class="section">
      <label for="muted">Mute these accounts (one name per line):</label>
      <textarea id="muted" placeholder="Jane Doe&#10;Some Friend Name"></textarea>
      <div id="saved" class="saved">Saved</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
