# MIST Discord bot configuration -- copy this to config.toml and fill in.
# config.toml is GITIGNORED (it holds your private guild/channel IDs).
# The bot TOKEN is NOT here -- it's read from the shared Exobrain env file
# (~/.claude/channels/discord/.env, key DISCORD_BOT_TOKEN).

[bot]
name = "MIST"                # display name used in messages and the LLM persona
# One or more servers to serve. Use guild_ids for several; guild_id for one.
guild_ids = [000000000000000000]  # server IDs (right-click server -> Copy Server ID)
guild_id = 000000000000000000     # optional single/primary (merged with guild_ids)
prefix = "!"
admin_ids = [000000000000000000]  # your Discord user ID(s) -- full command access
# mod_role_id = 000000000000000000  # optional: a role that also counts as admin

# Optional per-channel overrides. Key is the channel ID as a string.
# [channel.123456789012345678]
# prefix = "?"

# --- feature module config (filled in as phases land) ---

# [chatter]                  # Phase 5: LLM persona -- MIST replies to the OWNER
#                            # when @mentioned, replied to, or DMed.
# enabled = true
# model = "claude-opus-5-5[1m]"  # default `claude` CLI model: an alias ("fable"/
#                            # "opus"/"sonnet"/"haiku") or a full id. Switch live
#                            # with !model / /model; the choice persists in the DB.
# effort = "default"         # default thinking depth: low|medium|high|xhigh|max,
#                            # or "default" to let the CLI pick. Switch live with
#                            # !effort (aliases !think, !thinking) or /effort.
# guest_model = "claude-fable-5-1"  # model for NON-owner replies (the sandbox).
#                            # Independent of `model`: guests are where an
#                            # injection arrives, and those run on Fable. Falls
#                            # back to `model` only when Fable is out of credits.
# guard = true               # export MIST_UNATTENDED=1 to every CLI this starts,
#                            # so the harness guard hook refuses rule-file writes
#                            # and persistence shells. Off only to debug the bot.
# history = 12               # how many recent channel messages to use as context
# timeout = 600              # seconds to wait for a reply (private chats can do
#                            # real agentic work, so leave this generous)
# cwd = "/path/to/harness"   # where the CLI runs for PRIVATE chats. Defaults to
#                            # the harness root (this repo), so CLAUDE.md, memory,
#                            # skills and MCP servers load and she is the full MIST.
#                            # Shared servers always run sandboxed from /tmp.
# permission_mode = "bypassPermissions"  # CLI --permission-mode for private chats
# denied_tools = []          # tools to withhold even in private chats, e.g. ["Bash"]
# reply_to_others = false   # let people other than the owner talk to her
#                            # (@mention / reply / DM). They ALWAYS get the
#                            # sandbox + shared persona, never tools or memory.
# others_dm = true           # ...including in DMs (only matters when the above is on)
# others_cooldown = 15       # seconds between replies per guest; extra messages
#                            # get an hourglass reaction. Guest replies also run
#                            # one at a time so a pile-on can't fan out CLIs.
# always_respond_guilds = []  # guild IDs where she replies to EVERY owner
#                            # message (no @mention); e.g. a personal server
# private_guilds = []        # guild IDs treated as PRIVATE (she may speak freely);
#                            # defaults to always_respond_guilds. DMs are always
#                            # private. Everywhere else she withholds Alex's
#                            # private info (shared servers can be read by others).
# # Runs on the `claude` CLI headless (your Claude subscription), NOT the paid
# # Anthropic API -- no per-message cost, no API key needed.
# # owner_username = "your_discord_username"  # she ONLY replies to this user;
# #                            # defaults to DISCORD_ALEX_USERNAME in the harness .env
# # system = "..."           # optional: override MIST's built-in persona wholesale

# [bridge]                   # Live two-way channel "portals" (Fletcher's webhook
# enabled = true             # bridge). Open with `!portal #other-channel` (admin).
#                            # The bot needs the Manage Webhooks permission in both
#                            # channels. Portals may cross servers the bot is in.

# [instagram]                # Reel embedder: reply to a message with an Instagram
# enabled = true             # link and @mention MIST -- she reposts it so the reel
#                            # plays inline (Discord's native IG embed is broken).
# proxy_domain = "kkinstagram.com"  # embed-fixer frontend (Fletcher uses this one)
# reupload_video = false     # if true AND yt-dlp is installed, download the reel
#                            # and re-upload the mp4 directly (best when it works,
#                            # but Instagram often blocks yt-dlp; kkinstagram is
#                            # the reliable default).

# [threads]                  # Thread auto-join (Fletcher's use_threads). Anyone
# enabled = true             # runs `!preference use_threads true` (or a list of
#                            # #channels / category names) to be added to every
#                            # new public thread, so it shows in their sidebar.
#                            # The owner/admins can set it for others:
#                            # `!preference @user use_threads true`.
# default_on = []            # user IDs treated as `true` unless they opt out
#                            # (Fletcher gives this to the mod list)

# [greeting]                 # Phase 3: member onboarding
# rules_gate = false         # require new members to DM "I agree" before gaining access
# default_role_id = 0        # role granted on join / when no saved roles exist
