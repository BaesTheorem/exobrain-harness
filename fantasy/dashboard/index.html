<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week live · Roll for First Down</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta name="theme-color" content="#0E1013">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Tokens and rules: DESIGN.md in this folder. */
:root{--bg:#0E1013;--panel:#171A1F;--line:#262A31;--ink:#F2F2F0;--mute:#8B9099;--red:#E5383B;--steel:#C9C2B8;--track:#22262C}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px Inter,sans-serif;padding:24px;max-width:1280px;margin:0 auto}
.cond{font-family:'Barlow Condensed',sans-serif}
.top{display:grid;grid-template-columns:1fr 220px 1fr;background:var(--panel);border-top:4px solid var(--red)}
.team{padding:16px 24px;display:flex;align-items:center;gap:16px;min-width:0} .team.r{text-align:right}
.tn{font:600 26px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.5px;line-height:1.1}
.sc{font:700 64px 'Barlow Condensed';line-height:1}
.mid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto}
.mid .half{display:flex;align-items:center;justify-content:center;font:700 48px 'Barlow Condensed';line-height:1;padding:8px 4px}
.mid .a{background:var(--red);color:#fff} .mid .b{background:var(--steel);color:#0E1013}
.mid .tug{grid-column:1/3;height:6px;display:flex;background:var(--steel)} .mid .tug span{background:var(--red);display:block;height:100%}
.mid small{grid-column:1/3;text-align:center;background:#0E1013;color:var(--mute);font:600 12px 'Barlow Condensed';letter-spacing:2px;padding:3px 0}
.proj{color:var(--mute);font-size:12px}
.logo{width:64px;height:64px;object-fit:cover;flex:none;background:var(--line)} .logo.s{width:20px;height:20px} .logo.xs{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.jn{color:var(--mute);font:600 13px 'Barlow Condensed';margin-left:4px}
.chyron{display:flex;align-items:stretch;background:#F2F2F0;color:#0E1013;margin-top:2px}
.chyron .tag{white-space:nowrap;background:var(--red);color:#fff;font:700 15px 'Barlow Condensed';letter-spacing:2px;padding:8px 16px;display:flex;align-items:center}
.chyron .txt{font:600 20px 'Barlow Condensed';padding:8px 16px;text-transform:uppercase;letter-spacing:.3px}
.dek{color:var(--mute);font-size:12px;padding:8px 2px}
.err{color:var(--red);font-size:12px;padding:0 2px 8px}
.ticker{display:flex;gap:2px;margin:0 0 16px;flex-wrap:wrap}
.tk{flex:1;min-width:190px;background:var(--panel);padding:8px 12px;font:500 15px 'Barlow Condensed';white-space:nowrap;display:flex;gap:6px}
.tk{cursor:pointer;border-bottom:3px solid transparent} .tk:hover{background:#1E2228} .tk.sel{border-bottom-color:var(--red);background:#1E2228} .tk.mine span{color:var(--ink);font-weight:600} .tk b{margin-left:auto;padding-left:6px} .tk span{color:var(--mute);overflow:hidden;text-overflow:ellipsis;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr 300px;gap:16px}
.card{background:var(--panel);padding:16px;min-width:0}
h3{font:600 15px 'Barlow Condensed';letter-spacing:2px;color:var(--mute);margin-bottom:12px;text-transform:uppercase}
.prow{display:grid;grid-template-columns:44px 170px 1fr 92px;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.slot{font:600 13px 'Barlow Condensed';color:var(--mute)} .pn{font-weight:500;font-size:13px;line-height:1.2;min-width:0} .pn em{display:block;font-style:normal;color:var(--mute);font-size:11px}
.pn em.live{color:var(--red);font-weight:600}
.bar{height:10px;display:flex;background:var(--track)} .seg{display:block;height:100%}
.num{text-align:right;font:600 16px 'Barlow Condensed'} .num b{color:var(--red)}
.wide{grid-column:1/3}
.lg{color:var(--mute);font-size:12px;margin-top:8px} .lg i{display:inline-block;width:12px;height:8px;margin:0 4px 0 12px;vertical-align:middle}
.note{font:500 17px 'Barlow Condensed';letter-spacing:.3px;line-height:1.35} .note b{color:var(--red)}
table{width:100%;border-collapse:collapse;font:500 15px 'Barlow Condensed'}
th{font:600 12px 'Barlow Condensed';letter-spacing:1.5px;color:var(--mute);text-align:right;padding:4px 0} th:first-child{text-align:left}
td{padding:4px 0;border-bottom:1px solid var(--line);text-align:right} td:first-child{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
tr.me td{color:var(--red)}
.big{font:700 44px 'Barlow Condensed';line-height:1.05} .kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.kv small{display:block;color:var(--mute);font:600 12px 'Barlow Condensed';letter-spacing:1.5px}
.foot{color:var(--mute);font-size:11px;margin-top:16px;line-height:1.5}
#wp{position:relative} #tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);padding:6px 10px;font:600 14px 'Barlow Condensed';display:none;white-space:nowrap}
@media (max-width:980px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
@media (max-width:640px){.logo{width:40px;height:40px}body{padding:8px}.top{grid-template-columns:1fr 1fr}.mid{grid-column:1/3;grid-row:1}
 .team{padding:12px;flex-direction:column;align-items:flex-start;gap:6px}.team.r{flex-direction:column-reverse;align-items:flex-end}.team.r>div{margin-left:0!important}.team .sc{margin-left:0!important}.tn{font-size:18px}.sc{font-size:40px}.proj{display:none}
 .prow{grid-template-columns:36px 1fr 80px}.prow .bar{grid-column:2/4;grid-row:2}.chyron .txt{font-size:16px}}

/* View switch and chat (league chat + DMs through the Worker). */
.views{display:flex;gap:2px;margin-bottom:8px}
.views button{flex:none;background:var(--panel);color:var(--mute);border:0;font:600 14px 'Barlow Condensed';letter-spacing:2px;padding:8px 16px;cursor:pointer;border-bottom:3px solid transparent}
.views button.on{color:var(--ink);border-bottom-color:var(--red)} .views .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;background:var(--red);color:#fff;font-size:12px;letter-spacing:0;line-height:18px;text-align:center}
body.chat>:not(#vChat):not(.views):not(script){display:none!important} #vChat{display:none} body.chat #vChat{display:grid}
#vChat{grid-template-columns:300px 1fr;gap:16px;height:calc(100vh - 80px);height:calc(100dvh - 80px);min-height:420px}
#threads{background:var(--panel);overflow:auto} .th{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.th:hover,.th.sel{background:#1E2228} .th.sel{box-shadow:inset 3px 0 var(--red)} .th .tt{flex:1;min-width:0} .th b{font:600 15px 'Barlow Condensed';letter-spacing:.3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th small{color:var(--mute);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .th i.u{width:8px;height:8px;background:var(--red);flex:none}
.th .lg0{width:32px;height:32px;flex:none;background:var(--line);display:flex;align-items:center;justify-content:center;font:700 13px 'Barlow Condensed';color:var(--mute)}
.newdm{padding:10px 12px;border-bottom:1px solid var(--line)} .newdm select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);font:500 14px Inter;padding:6px}
#conv{background:var(--panel);display:flex;flex-direction:column;min-height:0} #convH{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font:600 18px 'Barlow Condensed';letter-spacing:.5px}
#convH button{display:none;background:none;border:0;color:var(--mute);font:600 14px 'Barlow Condensed';cursor:pointer;padding:0 8px 0 0}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:72%;display:flex;gap:8px;align-items:flex-end} .msg.mine{align-self:flex-end;flex-direction:row-reverse}
.bub{background:#22262C;padding:8px 12px;white-space:pre-wrap;word-wrap:break-word;font-size:14px;line-height:1.4} .msg.mine .bub{background:var(--red);color:#fff}
.meta{color:var(--mute);font-size:11px;margin-bottom:3px} .msg.mine .meta{text-align:right}
#compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
#txt{flex:1;resize:none;background:var(--bg);color:var(--ink);border:1px solid var(--line);font:400 15px/1.4 Inter;padding:8px 10px;min-height:42px;max-height:160px}
#send{background:var(--red);color:#fff;border:0;font:700 15px 'Barlow Condensed';letter-spacing:1.5px;padding:0 18px;height:42px;cursor:pointer} #send:disabled{opacity:.5;cursor:default}
#cnt{color:var(--mute);font-size:11px;padding:0 12px 8px} #cnt.warn{color:var(--red)}
@media (max-width:760px){#vChat{grid-template-columns:1fr;height:calc(100vh - 64px);height:calc(100dvh - 64px)} body.chat #vChat #conv{display:none} body.chat.open #vChat #conv{display:flex} body.chat.open #vChat #threads{display:none} #convH button{display:inline} .msg{max-width:88%}}
</style></head><body>
<nav class="views" role="tablist"><button data-v="scores" class="on">SCORES</button><button data-v="chat">CHAT<span class="dot" id="unread" hidden></span></button></nav>
<div class="top">
 <div class="team"><img class="logo" id="meL" alt=""><div><div class="tn" id="meN">–</div><div class="proj" id="meP"></div></div><div class="sc" id="meS" style="margin-left:auto">–</div></div>
 <div class="mid"><div class="half a" id="p">–</div><div class="half b" id="pb">–</div><div class="tug"><span id="tug"></span></div><small id="pl">WIN PROB</small></div>
 <div class="team r"><div class="sc" id="opS">–</div><div style="margin-left:auto"><div class="tn" id="opN">–</div><div class="proj" id="opP"></div></div><img class="logo" id="opL" alt=""></div>
</div>
<div class="chyron"><div class="tag" id="kick">WEEK –</div><div class="txt" id="h1">Loading the lineup model…</div></div>
<div class="dek" id="dek"></div><div class="err" id="err"></div>
<div class="ticker" id="ticker" role="tablist" aria-label="Matchups this week"></div>
<div class="grid">
 <div class="card"><h3 id="meH"></h3><div id="meR"></div></div>
 <div class="card"><h3 id="opH"></h3><div id="opR"></div></div>
 <div class="card" style="grid-row:span 2"><h3>Season outlook</h3><div class="kv" id="kv"></div><table id="season"></table>
  <div class="foot" id="sfoot"></div></div>
 <div class="card wide"><h3>Win probability, week <span id="wk"></span></h3>
  <div id="wp"><svg id="wpsvg" viewBox="0 0 860 220" width="100%" role="img" aria-label="Win probability over the week"></svg><div id="tip"></div></div>
  <div class="lg"><i style="background:var(--red)"></i>banked <i style="background:repeating-linear-gradient(45deg,var(--red) 0 2px,transparent 2px 6px)"></i>expected remaining · <span id="wplg"></span></div></div>
 <div class="card wide" id="noteC" hidden><h3>What would change this</h3><div class="note" id="note"></div></div>
</div>
<div class="foot" id="foot"></div>
<div id="vChat"><div id="threads"></div>
<div id="conv"><div id="convH"><button id="back">‹ CHATS</button><span id="convT">Pick a conversation</span></div><div id="msgs"></div>
<div id="cnt"></div><form id="compose"><textarea id="txt" rows="1" placeholder="Message" maxlength="2000"></textarea><button id="send" type="submit" disabled>SEND</button></form></div></div>
<script>
const $=id=>document.getElementById(id), f1=x=>(+x).toFixed(1), f2=x=>(+x).toFixed(2), pct=x=>Math.round(x*100)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function Phi(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
const last=n=>n.split(' ').slice(-1)[0];
function names(rs){const n=rs.map(r=>last(r.name));if(!n.length)return'';if(n.length>3)return n.length+' players';return n.length<3?n.join(' and '):n.slice(0,2).join(', ')+' and '+n[2]}
function bars(rows,col){return rows.map(r=>{const b=Math.max(r.bank,0),wb=b/30*100,wr=r.rem/30*100;
 const tag=r.state==='live'?`<em class="live">${r.team} ${esc(r.opp)} · LIVE · ${Math.round((1-r.left)*100)}% PLAYED</em>`:`<em>${r.team} ${esc(r.opp)} · ${r.state==='upcoming'?esc(r.kick):'FINAL'}</em>`;
 return `<div class="prow" title="${esc(r.name)}: ${f1(r.bank)} banked, ${f1(r.rem)} expected left"><span class="slot">${r.slot}</span>
 <span class="pn">${esc(r.name)}${r.jersey?`<span class="jn">#${esc(r.jersey)}</span>`:''}${r.status?' ('+esc(r.status[0])+')':''}${tag}</span>
 <span class="bar"><span class="seg" style="width:${wb}%;background:${col}"></span><span class="seg" style="width:${wr}%;background:repeating-linear-gradient(45deg,${col} 0 2px,transparent 2px 6px);outline:1px solid ${col};outline-offset:-1px"></span></span>
 <span class="num">${f2(r.bank)}${r.rem?` <b>+${f1(r.rem)}</b>`:''}</span></div>`}).join('')}
function chart(h,V){const W=860,H=220,L=150,R=16,T=12,B=24,s=$('wpsvg');
 const ink='#8B9099',rule='#262A31',red='#E5383B',steel='#C9C2B8',txt='#F2F2F0';
 const ts=h.map(d=>Date.parse(d.t)),t0=ts[0],t1=Math.max(ts[ts.length-1],t0+60e3);
 const x=t=>L+(t-t0)/(t1-t0)*(W-L-R),y=p=>T+(1-p)*(H-T-B),mid=y(.5);
 const fmt=t=>new Date(t).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'});
 // Both sides on one scale: the left team's chance runs up from the 50% line,
 // the right team's runs down from it, so the line reads as a tug of war.
 let g=`<defs><clipPath id="cA"><rect x="${L}" y="${T}" width="${W-L-R}" height="${mid-T}"/></clipPath><clipPath id="cB"><rect x="${L}" y="${mid}" width="${W-L-R}" height="${H-B-mid}"/></clipPath></defs>`;
 g+=[[1,'100%'],[.75,'75%'],[.5,'50%'],[.25,'75%'],[0,'100%']].map(([v,l])=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===.5?'#3A3F47':rule}"/><text x="${L-8}" y="${y(v)+4}" fill="${ink}" font-size="11" font-family="Inter" text-anchor="end">${l}</text>`).join('');
 const side=(t,yy,col,id)=>`<image href="${BASE}/logo/${t.team_id}" x="4" y="${yy-14}" width="28" height="28" preserveAspectRatio="xMidYMid slice"/><text x="38" y="${yy-2}" fill="${col}" font-size="12" font-weight="600" font-family="Barlow Condensed" letter-spacing=".3">${esc(t.team.toUpperCase().slice(0,20))}</text><text x="38" y="${yy+12}" fill="${ink}" font-size="11" font-family="Inter">${id}</text>`;
 g+=side(V.me,y(.85),red,'above the line')+side(V.opp,y(.15),steel,'below the line');
 g+=[t0,(t0+t1)/2,t1].map((t,i)=>`<text x="${x(t)}" y="${H-6}" fill="${ink}" font-size="11" font-family="Inter" text-anchor="${['start','middle','end'][i]}">${fmt(t)}</text>`).join('');
 const pts=h.map((d,i)=>`${x(ts[i]).toFixed(1)},${y(d.p).toFixed(1)}`),x0=x(t0),xn=x(ts[ts.length-1]);
 const area=`${x0},${mid} ${pts.join(' ')} ${xn},${mid}`;
 g+=`<polygon points="${area}" fill="rgba(229,56,59,.22)" clip-path="url(#cA)"/><polygon points="${area}" fill="rgba(201,194,184,.18)" clip-path="url(#cB)"/>`;
 g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${txt}" stroke-width="2" stroke-linejoin="round"/>`;
 const lp=h[h.length-1].p;
 g+=`<circle cx="${xn}" cy="${y(lp)}" r="5" fill="${lp>=.5?red:steel}" stroke="#171A1F" stroke-width="2"/>`;
 g+=`<line id="xh" y1="${T}" y2="${H-B}" stroke="${ink}" stroke-dasharray="2 3" visibility="hidden"/>`;
 g+=`<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="hit"/>`;
 s.innerHTML=g;
 const tip=$('tip'),xh=s.querySelector('#xh'),hit=s.querySelector('#hit');
 hit.onmousemove=e=>{const r=s.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*W;
  let i=0,best=1e9;ts.forEach((t,j)=>{const d=Math.abs(x(t)-sx);if(d<best){best=d;i=j}});const d=h[i];
  xh.setAttribute('x1',x(ts[i]));xh.setAttribute('x2',x(ts[i]));xh.setAttribute('visibility','visible');
  tip.style.display='block';tip.style.left=Math.min((x(ts[i])/W)*r.width+12,r.width-260)+'px';tip.style.top='8px';
  tip.innerHTML=`${fmt(ts[i])}<br><span style="color:#E5383B">${esc(V.me.team)} ${pct(d.p)}</span> · ${f2(d.me)}<br><span style="color:#C9C2B8">${esc(V.opp.team)} ${pct(1-d.p)}</span> · ${f2(d.opp)}`};
 hit.onmouseleave=()=>{tip.style.display='none';xh.setAttribute('visibility','hidden')};}
function render(S){S=merge(S,L0);
 if(!S.ok){$('h1').textContent='Waiting for the first pull';$('err').textContent=S.error||'';return}
 $('err').textContent=S.error?('Last pull failed: '+S.error+'. Showing '+S.at+'.'):'';
 if(!S.views[SEL])SEL=S.mine;const V=S.views[SEL],w=V.win,me=V.me,op=V.opp,mar=w.mu_me-w.mu_opp,ours=S.views[S.mine].me.team,isMine=SEL==S.mine;
 const rm=me.rows.filter(r=>r.rem>0).sort((a,b)=>b.rem-a.rem),ro=op.rows.filter(r=>r.rem>0).sort((a,b)=>b.rem-a.rem);
 const gap=op.actual-me.actual;
 $('kick').textContent=`WEEK ${S.week} · ${S.live?'LIVE':'BETWEEN GAMES'}${isMine?'':' · OTHER GAME'}`;$('wk').textContent=S.week;
 $('pl').textContent=S.live?'WIN PROB · LIVE':'WIN PROB';
 let h;
 if(!rm.length&&!ro.length) h=`${me.team} ${me.actual>op.actual?'beat':'lost to'} ${op.team}, ${f2(me.actual)} to ${f2(op.actual)}`;
 else if(rm.length&&ro.length) h=gap>0?`${me.team} needs ${names(rm)} to outscore ${names(ro)} by ${f2(gap)} from here`
   :`${me.team} leads by ${f2(-gap)}; ${names(ro)} must outscore ${names(rm)} by that much to flip it`;
 else if(rm.length) h=gap>0?`${me.team} needs ${f2(gap)} more points from ${names(rm)}`:`${me.team} leads by ${f2(-gap)} with ${names(rm)} still to play`;
 else h=gap<0?`${op.team} needs ${f2(-gap)} more points from ${names(ro)}`:`${me.team} trails by ${f2(gap)} and has nobody left to play`;
 $('h1').textContent=h;
 const left=rm.length+ro.length;
 $('dek').textContent=left?`${left} starter${left>1?'s':''} still to play · model final ${f1(w.mu_me)} to ${f1(w.mu_opp)} · spread of the rest of the week ${f1(w.sd_diff)} points`:'Every starter on both sides is final.';
 $('p').textContent=pct(w.p);$('pb').textContent=pct(1-w.p);$('tug').style.width=(w.p*100)+'%';$('p').title=me.team;$('pb').title=op.team;
 $('meN').textContent=me.team;$('opN').textContent=op.team;$('meS').textContent=f2(me.actual);$('opS').textContent=f2(op.actual);
 $('meP').textContent=`model final ${f1(w.mu_me)} ± ${f1(w.sd_me)}`;$('opP').textContent=`model final ${f1(w.mu_opp)} ± ${f1(w.sd_opp)}`;
 $('meL').src=BASE+'/logo/'+me.team_id;$('opL').src=BASE+'/logo/'+op.team_id;$('meH').textContent=me.team+' starters';$('opH').textContent=op.team;
 $('meR').innerHTML=bars(me.rows,'#E5383B');$('opR').innerHTML=bars(op.rows,'#C9C2B8');
 if(w.sd_diff>0&&left){const up=Phi((mar+6)/w.sd_diff),dn=Phi((mar-6)/w.sd_diff),bits=[];
  if(rm.length)bits.push(`A touchdown by ${esc(last(rm[0].name))} (6 points) moves ${esc(me.team)} to <b>${pct(up)}</b>.`);
  if(ro.length)bits.push(rm.length?`One by ${esc(last(ro[0].name))} drops it to <b>${pct(dn)}</b>.`:`A touchdown by ${esc(last(ro[0].name))} (6 points) drops ${esc(me.team)} to <b>${pct(dn)}</b>.`);
  $('note').innerHTML=bits.join(' ');$('noteC').hidden=false}else $('noteC').hidden=true;
 const hist=(S.history||[]).map(d=>isMine?d:(d.all&&d.all[SEL]?{t:d.t,...d.all[SEL]}:null)).filter(d=>d&&d.p!=null);hist.push({t:S.scoresAt||S.at,p:w.p,me:me.actual,opp:op.actual});chart(hist,V);
 $('wplg').textContent=hist.length<2?'one reading every 2 minutes while games are on; the line starts at the first one':'one reading every 2 minutes while games are on; hover for the score';
 $('ticker').innerHTML=S.games.map(g=>{const pm=g.mine?(g.h===ours?g.p:1-g.p):g.p;
  return `<div class="tk${g.id==SEL?' sel':''}${g.mine?' mine':''}" data-id="${g.id}" role="tab" tabindex="0" aria-selected="${g.id==SEL}" title="${esc(g.h)} ${f1(g.hs)} – ${f1(g.as)} ${esc(g.a)}">${logo(g.hid,'s')}<span>${esc(g.h)}</span> ${f2(g.hs)}–${f2(g.as)} <b>${pct(pm)}</b></div>`}).join('');
 if(S.season){const s=S.season,i=s.names.indexOf(ours),rows=s.names.map((n,j)=>[n,s.probs.bye[j],s.probs.playoffs[j]]).sort((a,b)=>b[1]-a[1]);
  if(i>=0)$('kv').innerHTML=[['BYE','bye'],['PLAYOFFS','playoffs'],['TITLE','champ'],['1 SEED','seed1']].map(([l,k])=>`<div><small>${l}</small><span class="big">${pct(s.probs[k][i])}</span></div>`).join('');
  const top=rows.slice(0,8);if(!top.some(r=>r[0]===ours))top.push(rows.find(r=>r[0]===ours));
  $('season').innerHTML='<tr><th>TEAM</th><th>BYE</th><th>PLAYOFFS</th></tr>'+top.map(r=>`<tr class="${r[0]===ours?'me':''}"><td>${logo((S.team_ids||{})[r[0]],'xs')}${esc(r[0])}</td><td>${pct(r[1])}</td><td>${pct(r[2])}</td></tr>`).join('');
  $('sfoot').textContent=`season_sim after week ${s.weeks_played} · a first-round bye is worth about 8 points of title odds`;}
 $('foot').textContent=`Scores and game clocks live from ESPN${S.scoresAt?' as of '+new Date(S.scoresAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'}):''}, every 10 s. Model inputs from the ${S.source==='cloud'?'cloud runner':'Mac'} at ${new Date(S.at).toLocaleTimeString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}${S.lineup_changed&&S.lineup_changed.length?' (a lineup changed since; a new model run is on the way)':''}. Win probability: the lineup model (0.75 market blend, position-tier spreads, same-game correlation, injury mixtures); a player in a live game keeps his projected rate for the share of the game left. Ticker odds are the home team's, except our game.`;}
const BASE=location.protocol==='file:'||location.origin==='null'?'https://scorebug.alex-hedtke.workers.dev':'';
let S0=null,L0=null,SEL=+(new URLSearchParams(location.hash.slice(1)).get('m'))||null;
function pick(id){SEL=+id;(()=>{const h=new URLSearchParams(location.hash.slice(1));h.set('m',id);history.replaceState(null,'','#'+h)})();if(S0)render(S0)}
document.addEventListener('click',e=>{const t=e.target.closest('.tk');if(t)pick(t.dataset.id)});
document.addEventListener('keydown',e=>{const t=e.target.closest&&e.target.closest('.tk');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(t.dataset.id)}});
const logo=(id,c)=>id==null?'':`<img class="logo ${c}" src="${BASE}/logo/${id}" alt="" loading="lazy">`;
// Overlay ESPN's live scores on the last model pull. The means move by the
// points scored since that pull; the spread waits for the next pull. Live
// scores older than the model pull are skipped, since the pull carries newer ones.
function merge(S,L){if(!S||!S.ok||!L||!L.teams||(L.at&&L.at<S.at))return S;const T=JSON.parse(JSON.stringify(S));
 const upd=side=>{const v=L.teams[side.team_id];if(v==null)return 0;const d=v-side.actual;side.actual=v;
  side.rows.forEach(r=>{const p=L.players[r.id];if(p!=null)r.bank=p});return d};
 Object.values(T.views).forEach(V=>{const w=V.win;w.mu_me+=upd(V.me);w.mu_opp+=upd(V.opp);
  w.p=w.sd_diff>0?Phi((w.mu_me-w.mu_opp)/w.sd_diff):(w.mu_me>w.mu_opp?1:0)});
 T.games.forEach(g=>{if(L.teams[g.hid]!=null)g.hs=L.teams[g.hid];if(L.teams[g.aid]!=null)g.as=L.teams[g.aid];
  const V=T.views[g.id];if(V)g.p=V.me.team_id===g.hid?V.win.p:1-V.win.p});
 T.scoresAt=L.at;return T}
const get=async p=>(await fetch(BASE+p,{cache:'no-store'})).json();
async function tick(){try{const s=await get('/api/state');if(s.ok===false)throw new Error(s.error);S0=s;render(S0)}catch(e){$('err').textContent='Scorebug not reachable ('+e.message+'). Showing the last good reading.'}}
tick();setInterval(tick,10e3);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

// ---------- chat ----------
let C=null,TSEL=null,seen=JSON.parse(localStorage.getItem('sb-seen')||'{}');
const ago=ms=>{const d=(Date.now()-ms)/1000;return d<60?'now':d<3600?Math.floor(d/60)+'m':d<86400?Math.floor(d/3600)+'h':new Date(ms).toLocaleDateString([], {month:'short',day:'numeric'})};
const unreadT=t=>t.messages.length&&!t.messages[t.messages.length-1].mine&&t.last>(seen[t.id]||0);
function setView(v){document.body.classList.toggle('chat',v==='chat');document.querySelectorAll('.views button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 if(v==='chat'){loadChat()}const h=new URLSearchParams(location.hash.slice(1));h.set('v',v);history.replaceState(null,'','#'+h)}
document.querySelector('.views').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});
function chatLogo(id,label){return id!=null?`<img class="logo" style="width:32px;height:32px" src="${BASE}/logo/${id}" alt="">`:`<span class="lg0">${esc((label||'?').slice(0,2).toUpperCase())}</span>`}
function renderThreads(){if(!C)return;const n=C.threads.filter(unreadT).length,u=$('unread');u.hidden=!n;u.textContent=n;
 $('threads').innerHTML=`<div class="newdm"><select id="dmPick"><option value="">New direct message…</option>${C.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>`+
 C.threads.map(t=>{const m=t.messages[t.messages.length-1];return `<div class="th${t.id===TSEL?' sel':''}" data-id="${esc(t.id)}">${t.dm?chatLogo(t.team_id,t.title):'<span class="lg0" style="color:var(--red)">ALL</span>'}
 <span class="tt"><b>${esc(t.title)}</b><small>${m?esc((m.mine?'You: ':'')+m.content):'No messages yet'}</small></span><small>${t.last?ago(t.last):''}</small>${unreadT(t)?'<i class="u"></i>':''}</div>`}).join('');
 $('dmPick').onchange=async e=>{const id=e.target.value;if(!id)return;const r=await post('/api/chat/open',{team_id:+id});if(r.topic){await loadChat(true);openThread(r.topic)}else $('cnt').textContent='Could not open that conversation: '+(r.error||'unknown error')}}
function renderConv(){const t=C&&C.threads.find(x=>x.id===TSEL);$('send').disabled=!t;if(!t){$('convT').textContent='Pick a conversation';$('msgs').innerHTML='';return}
 $('convT').textContent=t.title;const box=$('msgs'),atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<40;
 box.innerHTML=t.messages.map(m=>`<div class="msg${m.mine?' mine':''}">${m.mine?'':chatLogo(m.team_id,m.who)}<div><div class="meta">${esc(m.who)} · ${ago(m.date)}</div><div class="bub">${esc(m.content)}</div></div></div>`).join('')||'<div class="meta">No messages yet. Say hello.</div>';
 if(atEnd||box.dataset.t!==t.id){box.scrollTop=box.scrollHeight;box.dataset.t=t.id}
 seen[t.id]=t.last||Date.now();localStorage.setItem('sb-seen',JSON.stringify(seen))}
function openThread(id){TSEL=id;document.body.classList.add('open');renderThreads();renderConv();$('txt').focus()}
$('threads').addEventListener('click',e=>{const t=e.target.closest('.th');if(t)openThread(t.dataset.id)});
$('back').onclick=()=>{document.body.classList.remove('open');TSEL=null;renderThreads()};
const post=async(p,b)=>{try{return await (await fetch(BASE+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)})).json()}catch(e){return {error:e.message}}};
async function loadChat(force){try{const d=await get('/api/chat');if(d.threads){C=d;renderThreads();if(document.body.classList.contains('chat'))renderConv()}}catch(e){}}
function count(){const v=$('txt').value.trim(),n=v?Math.ceil(v.length/240):0,el=$('cnt');el.className=v.length>240?'warn':'';
 el.textContent=!v?'':v.length<=240?`${v.length}/240`:`${v.length} characters: ESPN takes 240 a post, so this goes out as about ${n} messages`;
 $('txt').style.height='auto';$('txt').style.height=Math.min($('txt').scrollHeight,160)+'px'}
$('txt').addEventListener('input',count);
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();$('compose').requestSubmit()}});
$('compose').onsubmit=async e=>{e.preventDefault();const text=$('txt').value.trim();if(!text||!TSEL)return;const b=$('send');b.disabled=true;b.textContent='SENDING';
 const r=await post('/api/chat/send',{topic:TSEL,text});b.textContent='SEND';b.disabled=false;
 if(r.verified){$('txt').value='';count();await loadChat(true)}else $('cnt').textContent=r.error?('Not sent: '+r.error):`Sent ${r.sent} of ${r.chunks}; check the thread before you try again (${(r.failed[0]||{}).error||'read-back did not match'})`;}
setInterval(()=>loadChat(),document.hidden?60e3:10e3);loadChat();
function fromHash(){const h=new URLSearchParams(location.hash.slice(1));if(h.get('v')==='chat'){setView('chat');const t=h.get('t');if(t){const go=()=>C?openThread(t):setTimeout(go,300);go()}}}
fromHash();window.addEventListener('hashchange',fromHash);
</script></body></html>
