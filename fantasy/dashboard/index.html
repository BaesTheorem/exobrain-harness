<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week live · Roll for First Down</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens and rules: DESIGN.md in this folder. */
:root{--bg:#0E1013;--panel:#171A1F;--line:#262A31;--ink:#F2F2F0;--mute:#8B9099;--red:#E5383B;--steel:#C9C2B8;--track:#22262C}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px Inter,sans-serif;padding:24px;max-width:1280px;margin:0 auto}
.cond{font-family:'Barlow Condensed',sans-serif}
.top{display:grid;grid-template-columns:1fr 220px 1fr;background:var(--panel);border-top:4px solid var(--red)}
.team{padding:16px 24px;display:flex;align-items:center;gap:16px;min-width:0} .team.r{text-align:right}
.tn{font:600 26px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.5px;line-height:1.1}
.sc{font:700 64px 'Barlow Condensed';line-height:1}
.mid{background:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.mid .p{font:700 56px 'Barlow Condensed';line-height:1} .mid small{font:600 13px 'Barlow Condensed';letter-spacing:2px}
.proj{color:var(--mute);font-size:12px}
.chyron{display:flex;align-items:stretch;background:#F2F2F0;color:#0E1013;margin-top:2px}
.chyron .tag{white-space:nowrap;background:var(--red);color:#fff;font:700 15px 'Barlow Condensed';letter-spacing:2px;padding:8px 16px;display:flex;align-items:center}
.chyron .txt{font:600 20px 'Barlow Condensed';padding:8px 16px;text-transform:uppercase;letter-spacing:.3px}
.dek{color:var(--mute);font-size:12px;padding:8px 2px}
.err{color:var(--red);font-size:12px;padding:0 2px 8px}
.ticker{display:flex;gap:2px;margin:0 0 16px;flex-wrap:wrap}
.tk{flex:1;min-width:150px;background:var(--panel);padding:8px 12px;font:500 15px 'Barlow Condensed';white-space:nowrap;overflow:hidden}
.tk.me{box-shadow:inset 0 -3px var(--red)} .tk b{float:right;margin-left:8px} .tk span{color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr 300px;gap:16px}
.card{background:var(--panel);padding:16px;min-width:0}
h3{font:600 15px 'Barlow Condensed';letter-spacing:2px;color:var(--mute);margin-bottom:12px;text-transform:uppercase}
.prow{display:grid;grid-template-columns:44px 170px 1fr 92px;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.slot{font:600 13px 'Barlow Condensed';color:var(--mute)} .pn{font-weight:500;font-size:13px;line-height:1.2;min-width:0} .pn em{display:block;font-style:normal;color:var(--mute);font-size:11px}
.pn em.live{color:var(--red);font-weight:600}
.bar{height:10px;display:flex;background:var(--track)} .seg{display:block;height:100%}
.num{text-align:right;font:600 16px 'Barlow Condensed'} .num b{color:var(--red)}
.wide{grid-column:1/3}
.lg{color:var(--mute);font-size:12px;margin-top:8px} .lg i{display:inline-block;width:12px;height:8px;margin:0 4px 0 12px;vertical-align:middle}
.note{font:500 17px 'Barlow Condensed';letter-spacing:.3px;line-height:1.35} .note b{color:var(--red)}
table{width:100%;border-collapse:collapse;font:500 15px 'Barlow Condensed'}
th{font:600 12px 'Barlow Condensed';letter-spacing:1.5px;color:var(--mute);text-align:right;padding:4px 0} th:first-child{text-align:left}
td{padding:4px 0;border-bottom:1px solid var(--line);text-align:right} td:first-child{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
tr.me td{color:var(--red)}
.big{font:700 44px 'Barlow Condensed';line-height:1.05} .kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.kv small{display:block;color:var(--mute);font:600 12px 'Barlow Condensed';letter-spacing:1.5px}
.foot{color:var(--mute);font-size:11px;margin-top:16px;line-height:1.5}
#wp{position:relative} #tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);padding:6px 10px;font:600 14px 'Barlow Condensed';display:none;white-space:nowrap}
@media (max-width:980px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
@media (max-width:640px){body{padding:8px}.top{grid-template-columns:1fr 1fr}.mid{grid-column:1/3;grid-row:1;flex-direction:row;gap:12px}
 .team{padding:12px}.tn{font-size:18px}.sc{font-size:44px}.team.r{flex-direction:row-reverse}
 .prow{grid-template-columns:36px 1fr 80px}.prow .bar{grid-column:2/4;grid-row:2}.chyron .txt{font-size:16px}}
</style></head><body>
<div class="top">
 <div class="team"><div><div class="tn" id="meN">–</div><div class="proj" id="meP"></div></div><div class="sc" id="meS" style="margin-left:auto">–</div></div>
 <div class="mid"><div class="p" id="p">–</div><small id="pl">WIN PROB</small></div>
 <div class="team r"><div class="sc" id="opS">–</div><div style="margin-left:auto"><div class="tn" id="opN">–</div><div class="proj" id="opP"></div></div></div>
</div>
<div class="chyron"><div class="tag" id="kick">WEEK –</div><div class="txt" id="h1">Loading the lineup model…</div></div>
<div class="dek" id="dek"></div><div class="err" id="err"></div>
<div class="ticker" id="ticker"></div>
<div class="grid">
 <div class="card"><h3 id="meH"></h3><div id="meR"></div></div>
 <div class="card"><h3 id="opH"></h3><div id="opR"></div></div>
 <div class="card" style="grid-row:span 2"><h3>Season outlook</h3><div class="kv" id="kv"></div><table id="season"></table>
  <div class="foot" id="sfoot"></div></div>
 <div class="card wide"><h3>Win probability, week <span id="wk"></span></h3>
  <div id="wp"><svg id="wpsvg" viewBox="0 0 860 200" width="100%" role="img" aria-label="Win probability over the week"></svg><div id="tip"></div></div>
  <div class="lg"><i style="background:var(--red)"></i>banked <i style="background:repeating-linear-gradient(45deg,var(--red) 0 2px,transparent 2px 6px)"></i>expected remaining · <span id="wplg"></span></div></div>
 <div class="card wide" id="noteC" hidden><h3>What would change this</h3><div class="note" id="note"></div></div>
</div>
<div class="foot" id="foot"></div>
<script>
const $=id=>document.getElementById(id), f1=x=>(+x).toFixed(1), pct=x=>Math.round(x*100)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function Phi(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
const last=n=>n.split(' ').slice(-1)[0];
function names(rs){const n=rs.map(r=>last(r.name));if(!n.length)return'';if(n.length>3)return n.length+' players';return n.length<3?n.join(' and '):n.slice(0,2).join(', ')+' and '+n[2]}
function bars(rows,col){return rows.map(r=>{const b=Math.max(r.bank,0),wb=b/30*100,wr=r.rem/30*100;
 const tag=r.state==='live'?`<em class="live">${r.team} ${esc(r.opp)} · LIVE · ${Math.round((1-r.left)*100)}% PLAYED</em>`:`<em>${r.team} ${esc(r.opp)} · ${r.state==='upcoming'?esc(r.kick):'FINAL'}</em>`;
 return `<div class="prow" title="${esc(r.name)}: ${f1(r.bank)} banked, ${f1(r.rem)} expected left"><span class="slot">${r.slot}</span>
 <span class="pn">${esc(r.name)}${r.status?' ('+esc(r.status[0])+')':''}${tag}</span>
 <span class="bar"><span class="seg" style="width:${wb}%;background:${col}"></span><span class="seg" style="width:${wr}%;background:repeating-linear-gradient(45deg,${col} 0 2px,transparent 2px 6px);outline:1px solid ${col};outline-offset:-1px"></span></span>
 <span class="num">${f1(r.bank)}${r.rem?` <b>+${f1(r.rem)}</b>`:''}</span></div>`}).join('')}
function chart(h){const W=860,H=200,L=44,R=16,T=10,B=24,s=$('wpsvg');
 const ink='#8B9099',rule='#262A31',red='#E5383B';
 const ts=h.map(d=>Date.parse(d.t)),t0=ts[0],t1=Math.max(ts[ts.length-1],t0+60e3);
 const x=t=>L+(t-t0)/(t1-t0)*(W-L-R),y=p=>T+(1-p)*(H-T-B);
 const fmt=t=>new Date(t).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'});
 let g=[0,.5,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${rule}"/><text x="${L-8}" y="${y(v)+4}" fill="${ink}" font-size="11" font-family="Inter" text-anchor="end">${v*100}%</text>`).join('');
 g+=[t0,(t0+t1)/2,t1].map((t,i)=>`<text x="${x(t)}" y="${H-6}" fill="${ink}" font-size="11" font-family="Inter" text-anchor="${['start','middle','end'][i]}">${fmt(t)}</text>`).join('');
 const pts=h.map((d,i)=>`${x(ts[i]).toFixed(1)},${y(d.p).toFixed(1)}`);
 g+=`<polygon points="${x(t0)},${y(0)} ${pts.join(' ')} ${x(ts[ts.length-1])},${y(0)}" fill="rgba(229,56,59,.12)"/>`;
 g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${red}" stroke-width="2" stroke-linejoin="round"/>`;
 g+=`<circle cx="${x(ts[ts.length-1])}" cy="${y(h[h.length-1].p)}" r="5" fill="${red}" stroke="#171A1F" stroke-width="2"/>`;
 g+=`<line id="xh" y1="${T}" y2="${H-B}" stroke="${ink}" stroke-dasharray="2 3" visibility="hidden"/>`;
 g+=`<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="hit"/>`;
 s.innerHTML=g;
 const tip=$('tip'),xh=s.querySelector('#xh'),hit=s.querySelector('#hit');
 hit.onmousemove=e=>{const r=s.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*W;
  let i=0,best=1e9;ts.forEach((t,j)=>{const d=Math.abs(x(t)-sx);if(d<best){best=d;i=j}});const d=h[i];
  xh.setAttribute('x1',x(ts[i]));xh.setAttribute('x2',x(ts[i]));xh.setAttribute('visibility','visible');
  tip.style.display='block';tip.style.left=Math.min((x(ts[i])/W)*r.width+12,r.width-170)+'px';tip.style.top='8px';
  tip.innerHTML=`${fmt(ts[i])}<br>${pct(d.p)} · ${f1(d.me)}–${f1(d.opp)}`};
 hit.onmouseleave=()=>{tip.style.display='none';xh.setAttribute('visibility','hidden')};}
function render(S){
 if(!S.ok){$('h1').textContent='Waiting for the first pull';$('err').textContent=S.error||'';return}
 $('err').textContent=S.error?('Last pull failed: '+S.error+'. Showing '+S.at+'.'):'';
 const w=S.win,me=S.me,op=S.opp,mar=w.mu_me-w.mu_opp;
 const rm=me.rows.filter(r=>r.rem>0).sort((a,b)=>b.rem-a.rem),ro=op.rows.filter(r=>r.rem>0).sort((a,b)=>b.rem-a.rem);
 const gap=op.actual-me.actual;
 $('kick').textContent=`WEEK ${S.week} · ${S.live?'LIVE':'BETWEEN GAMES'}`;$('wk').textContent=S.week;
 $('pl').textContent=S.live?'WIN PROB · LIVE':'WIN PROB';
 let h;
 if(!rm.length&&!ro.length) h=`${me.team} ${me.actual>op.actual?'beat':'lost to'} ${op.team}, ${f1(me.actual)} to ${f1(op.actual)}`;
 else if(rm.length&&ro.length) h=gap>0?`${me.team} needs ${names(rm)} to outscore ${names(ro)} by ${f1(gap)} from here`
   :`${me.team} leads by ${f1(-gap)}; ${names(ro)} must outscore ${names(rm)} by that much to flip it`;
 else if(rm.length) h=gap>0?`${me.team} needs ${f1(gap)} more points from ${names(rm)}`:`${me.team} leads by ${f1(-gap)} with ${names(rm)} still to play`;
 else h=gap<0?`${op.team} needs ${f1(-gap)} more points from ${names(ro)}`:`${me.team} trails by ${f1(gap)} and has nobody left to play`;
 $('h1').textContent=h;
 const left=rm.length+ro.length;
 $('dek').textContent=left?`${left} starter${left>1?'s':''} still to play · model final ${f1(w.mu_me)} to ${f1(w.mu_opp)} · spread of the rest of the week ${f1(w.sd_diff)} points`:'Every starter on both sides is final.';
 $('p').textContent=pct(w.p);
 $('meN').textContent=me.team;$('opN').textContent=op.team;$('meS').textContent=f1(me.actual);$('opS').textContent=f1(op.actual);
 $('meP').textContent=`model final ${f1(w.mu_me)} ± ${f1(w.sd_me)}`;$('opP').textContent=`model final ${f1(w.mu_opp)} ± ${f1(w.sd_opp)}`;
 $('meH').textContent=me.team+' starters';$('opH').textContent=op.team;
 $('meR').innerHTML=bars(me.rows,'#E5383B');$('opR').innerHTML=bars(op.rows,'#C9C2B8');
 if(w.sd_diff>0&&left){const up=Phi((mar+6)/w.sd_diff),dn=Phi((mar-6)/w.sd_diff),bits=[];
  if(rm.length)bits.push(`A touchdown by ${esc(last(rm[0].name))} (6 points) moves ${esc(me.team)} to <b>${pct(up)}</b>.`);
  if(ro.length)bits.push(`One by ${esc(last(ro[0].name))} drops it to <b>${pct(dn)}</b>.`);
  $('note').innerHTML=bits.join(' ');$('noteC').hidden=false}else $('noteC').hidden=true;
 const hist=(S.history||[]).filter(d=>d.p!=null);if(hist.length)chart(hist);
 $('wplg').textContent=hist.length<2?'one reading a minute while games are on; the line starts at the first one':'one reading a minute while games are on; hover for the score';
 $('ticker').innerHTML=S.games.map(g=>{const pm=g.mine?(g.h===me.team?g.p:1-g.p):g.p;
  return `<div class="tk${g.mine?' me':''}" title="${esc(g.h)} ${f1(g.hs)} – ${f1(g.as)} ${esc(g.a)}"><span>${esc(g.h.slice(0,14))}</span> ${Math.round(g.hs)}–${Math.round(g.as)} <b>${pct(pm)}</b></div>`}).join('');
 if(S.season){const s=S.season,i=s.names.indexOf(me.team),rows=s.names.map((n,j)=>[n,s.probs.bye[j],s.probs.playoffs[j]]).sort((a,b)=>b[1]-a[1]);
  if(i>=0)$('kv').innerHTML=[['BYE','bye'],['PLAYOFFS','playoffs'],['TITLE','champ'],['1 SEED','seed1']].map(([l,k])=>`<div><small>${l}</small><span class="big">${pct(s.probs[k][i])}</span></div>`).join('');
  const top=rows.slice(0,8);if(!top.some(r=>r[0]===me.team))top.push(rows.find(r=>r[0]===me.team));
  $('season').innerHTML='<tr><th>TEAM</th><th>BYE</th><th>PLAYOFFS</th></tr>'+top.map(r=>`<tr class="${r[0]===me.team?'me':''}"><td>${esc(r[0])}</td><td>${pct(r[1])}</td><td>${pct(r[2])}</td></tr>`).join('');
  $('sfoot').textContent=`season_sim after week ${s.weeks_played} · a first-round bye is worth about 8 points of title odds`;}
 $('foot').textContent=`Updated ${new Date(S.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}. Ticker odds are the home team's, except our game, which shows ours. Source: ESPN league API and the public NFL scoreboard, priced by espn matchup (0.75 market blend, position-tier spreads, same-game correlation; in-progress players keep their projected rate for the share of the game left). Refreshes every 60 s while games are on.`;}
const API=location.protocol==='file:'||location.origin==='null'?'http://127.0.0.1:5023/api/state':'/api/state';
async function tick(){try{render(await (await fetch(API,{cache:'no-store'})).json())}catch(e){$('err').textContent='Dashboard server not reachable ('+e.message+'). Start it with fantasy/bin/ff-dash.'}}
tick();setInterval(tick,60e3);
</script></body></html>
