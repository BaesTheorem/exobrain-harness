<style>
/* Tokens and rules: DESIGN.md in this folder. */
:root{--bg:#0E1013;--panel:#171A1F;--line:#262A31;--ink:#F2F2F0;--mute:#8B9099;--red:#E5383B;--steel:#C9C2B8;--track:#22262C}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px Inter,sans-serif;padding:24px;max-width:1280px;margin:0 auto}
.cond{font-family:'Barlow Condensed',sans-serif}
.top{display:grid;grid-template-columns:1fr 220px 1fr;background:var(--panel);border-top:4px solid var(--red)}
.team{padding:16px 24px;display:flex;align-items:center;gap:16px;min-width:0} .team.r{text-align:right}
.tn{font:600 26px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.5px;line-height:1.1}
.sc{font:700 64px 'Barlow Condensed';line-height:1}
.mid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto}
.mid .half{display:flex;align-items:center;justify-content:center;font:700 48px 'Barlow Condensed';line-height:1;padding:8px 4px}
.mid .a{background:var(--red);color:#fff} .mid .b{background:var(--steel);color:#0E1013}
.mid .tug{grid-column:1/3;height:6px;display:flex;background:var(--steel)} .mid .tug span{background:var(--red);display:block;height:100%}
.mid small{grid-column:1/3;text-align:center;background:#0E1013;color:var(--mute);font:600 12px 'Barlow Condensed';letter-spacing:2px;padding:3px 0}
.proj{color:var(--mute);font-size:12px}
.logo{width:64px;height:64px;object-fit:cover;flex:none;background:var(--line)} .logo.s{width:20px;height:20px} .logo.xs{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.jn{color:var(--mute);font:600 13px 'Barlow Condensed';margin-left:4px}
.chyron{display:flex;align-items:stretch;background:#F2F2F0;color:#0E1013;margin-top:2px}
.chyron .tag{white-space:nowrap;background:var(--red);color:#fff;font:700 15px 'Barlow Condensed';letter-spacing:2px;padding:8px 16px;display:flex;align-items:center}
.chyron .txt{font:600 20px 'Barlow Condensed';padding:8px 16px;text-transform:uppercase;letter-spacing:.3px}
.dek{color:var(--mute);font-size:12px;padding:8px 2px}
.err{color:var(--red);font-size:12px;padding:0 2px 8px}
.ticker{display:flex;gap:2px;margin:0 0 16px;flex-wrap:wrap}
.tk{flex:1;min-width:190px;background:var(--panel);padding:8px 12px;font:500 15px 'Barlow Condensed';white-space:nowrap;display:flex;gap:6px}
.tk{cursor:pointer;border-bottom:3px solid transparent} .tk:hover{background:#1E2228} .tk.sel{border-bottom-color:var(--red);background:#1E2228} .tk.mine span{color:var(--ink);font-weight:600} .tk b{margin-left:auto;padding-left:6px} .tk span{color:var(--mute);overflow:hidden;text-overflow:ellipsis;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr 300px;gap:16px}
.card{background:var(--panel);padding:16px;min-width:0}
h3{font:600 15px 'Barlow Condensed';letter-spacing:2px;color:var(--mute);margin-bottom:12px;text-transform:uppercase}
.prow{display:grid;grid-template-columns:44px 170px 1fr 92px;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.slot{font:600 13px 'Barlow Condensed';color:var(--mute)} .pn{font-weight:500;font-size:13px;line-height:1.2;min-width:0} .pn em{display:block;font-style:normal;color:var(--mute);font-size:11px}
.pn em.live{color:var(--red);font-weight:600}
.bar{height:10px;display:flex;background:var(--track)} .seg{display:block;height:100%}
.num{text-align:right;font:600 16px 'Barlow Condensed'} .num b{color:var(--red)}
.wide{grid-column:1/3}
.lg{color:var(--mute);font-size:12px;margin-top:8px} .lg i{display:inline-block;width:12px;height:8px;margin:0 4px 0 12px;vertical-align:middle}
.note{font:500 17px 'Barlow Condensed';letter-spacing:.3px;line-height:1.35} .note b{color:var(--red)}
table{width:100%;border-collapse:collapse;font:500 15px 'Barlow Condensed'}
th{font:600 12px 'Barlow Condensed';letter-spacing:1.5px;color:var(--mute);text-align:right;padding:4px 0} th:first-child{text-align:left}
td{padding:4px 0;border-bottom:1px solid var(--line);text-align:right} td:first-child{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
tr.me td{color:var(--red)}
.big{font:700 44px 'Barlow Condensed';line-height:1.05} .kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.kv small{display:block;color:var(--mute);font:600 12px 'Barlow Condensed';letter-spacing:1.5px}
.foot{color:var(--mute);font-size:11px;margin-top:16px;line-height:1.5}
#wp{position:relative} #tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);padding:6px 10px;font:600 14px 'Barlow Condensed';display:none;white-space:nowrap}
@media (max-width:980px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
@media (max-width:640px){.logo{width:40px;height:40px}body{padding:8px}.top{grid-template-columns:1fr 1fr}.mid{grid-column:1/3;grid-row:1}
 .team{padding:12px;flex-direction:column;align-items:flex-start;gap:6px}.team.r{flex-direction:column-reverse;align-items:flex-end}.team.r>div{margin-left:0!important}.team .sc{margin-left:0!important}.tn{font-size:18px}.sc{font-size:40px}.proj{display:none}
 .prow{grid-template-columns:36px 1fr 80px}.prow .bar{grid-column:2/4;grid-row:2}.chyron .txt{font-size:16px}}

/* View switch and chat (league chat + DMs through the Worker). */
.views{display:flex;gap:2px;margin-bottom:8px}
.views button{flex:none;background:var(--panel);color:var(--mute);border:0;font:600 14px 'Barlow Condensed';letter-spacing:2px;padding:8px 16px;cursor:pointer;border-bottom:3px solid transparent}
.views button.on{color:var(--ink);border-bottom-color:var(--red)} .views .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;background:var(--red);color:#fff;font-size:12px;letter-spacing:0;line-height:18px;text-align:center}
body.chat>:not(#vChat):not(.views):not(script){display:none!important} #vChat{display:none} body.chat #vChat{display:grid}
#vChat{grid-template-columns:300px 1fr;gap:16px;height:calc(100vh - 80px);height:calc(100dvh - 80px);min-height:420px}
#threads{background:var(--panel);overflow:auto} .th{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.th:hover,.th.sel{background:#1E2228} .th.sel{box-shadow:inset 3px 0 var(--red)} .th .tt{flex:1;min-width:0} .th b{font:600 15px 'Barlow Condensed';letter-spacing:.3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th small{color:var(--mute);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .th i.u{width:8px;height:8px;background:var(--red);flex:none}
.th .lg0{width:32px;height:32px;flex:none;background:var(--line);display:flex;align-items:center;justify-content:center;font:700 13px 'Barlow Condensed';color:var(--mute)}
.newdm{padding:10px 12px;border-bottom:1px solid var(--line)} .newdm select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);font:500 14px Inter;padding:6px}
#conv{background:var(--panel);display:flex;flex-direction:column;min-height:0} #convH{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font:600 18px 'Barlow Condensed';letter-spacing:.5px}
#convH button{display:none;background:none;border:0;color:var(--mute);font:600 14px 'Barlow Condensed';cursor:pointer;padding:0 8px 0 0}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:72%;display:flex;gap:8px;align-items:flex-end} .msg.mine{align-self:flex-end;flex-direction:row-reverse}
.bub{background:#22262C;padding:8px 12px;white-space:pre-wrap;word-wrap:break-word;font-size:14px;line-height:1.4} .msg.mine .bub{background:var(--red);color:#fff}
.meta{color:var(--mute);font-size:11px;margin-bottom:3px} .msg.mine .meta{text-align:right}
#compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
#txt{flex:1;resize:none;background:var(--bg);color:var(--ink);border:1px solid var(--line);font:400 15px/1.4 Inter;padding:8px 10px;min-height:42px;max-height:160px}
#send{background:var(--red);color:#fff;border:0;font:700 15px 'Barlow Condensed';letter-spacing:1.5px;padding:0 18px;height:42px;cursor:pointer} #send:disabled{opacity:.5;cursor:default}
#cnt{color:var(--mute);font-size:11px;padding:0 12px 8px} #cnt.warn{color:var(--red)}
@media (max-width:760px){#vChat{grid-template-columns:1fr;height:calc(100vh - 64px);height:calc(100dvh - 64px)} body.chat #vChat #conv{display:none} body.chat.open #vChat #conv{display:flex} body.chat.open #vChat #threads{display:none} #convH button{display:inline} .msg{max-width:88%}}

/* Wire: every team's moves, the waiver order and needs, the analysis (DESIGN.md, "The Wire"). */
body.wire>:not(#vWire):not(.views):not(script){display:none!important} #vWire{display:none} body.wire #vWire{display:block}
.wgrid{display:grid;grid-template-columns:1fr 1fr 340px;gap:16px;margin-top:16px} .w2{grid-column:1/3} .w3{grid-column:1/4}
.wl{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.35}
.wl:last-child{border-bottom:0} .wl .t{flex:none;width:76px;color:var(--mute);font:600 13px 'Barlow Condensed'}
.wl .who{flex:none;width:52px;font:600 14px 'Barlow Condensed';display:flex;gap:4px;align-items:center} .wl .who.me{color:var(--red)}
.wl .bd{flex:none;font:600 11px 'Barlow Condensed';letter-spacing:1.2px;padding:1px 6px;background:var(--track);color:var(--ink);min-width:58px;text-align:center}
.wl .bd.me{background:var(--red);color:#fff} .wl .bd.hot{background:var(--ink);color:var(--bg)}
.wl .what{flex:1;min-width:0} .wl .what em{font-style:normal;color:var(--mute)}
.wk{font:600 13px 'Barlow Condensed';letter-spacing:2px;color:var(--mute);padding:14px 0 4px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:8px} .chips button,.chips select{background:var(--bg);color:var(--mute);border:1px solid var(--line);font:600 13px 'Barlow Condensed';letter-spacing:1.5px;padding:5px 10px;cursor:pointer}
.chips button.on{color:var(--ink);border-color:var(--red)} .chips select{letter-spacing:.3px;margin-left:auto}
#wBoard td,#wBoard th{padding:5px 6px 5px 0;vertical-align:top} #wBoard td:first-child{width:28px} #wBoard tr.pick td{background:#1E2228} #wBoard tbody tr{cursor:pointer}
#wBoard td.nd{text-align:left;white-space:normal;max-width:none;color:var(--ink)} #wBoard td.nd i{font-style:normal;color:var(--mute)}
#wBoard td:nth-child(2){max-width:200px}
.read p{font:500 16px 'Barlow Condensed';letter-spacing:.3px;line-height:1.35;padding:6px 0;border-bottom:1px solid var(--line)} .read p:last-child{border-bottom:0}
.read p b{color:var(--steel);font-weight:600}
.pend{padding:8px 0;border-bottom:1px solid var(--line)} .pend:last-child{border-bottom:0} .pend b{font:600 16px 'Barlow Condensed';letter-spacing:.3px}
.pend small{display:block;color:var(--mute);font-size:12px;margin-top:2px} .pend .bd{font:600 11px 'Barlow Condensed';letter-spacing:1.2px;padding:1px 6px;margin-right:8px;background:var(--red);color:#fff}
.pend .bd.lg{background:var(--ink);color:var(--bg)}
.empty{color:var(--mute);font-size:13px;padding:6px 0}
.views .dot.off{display:none} .pend em{font:400 12px Inter;color:var(--mute)} .wpos{color:var(--mute);font-size:12px}
#wBoard th:nth-child(2),#wBoard td:nth-child(2){text-align:left}
.more{background:var(--bg);color:var(--ink);border:1px solid var(--line);font:600 13px 'Barlow Condensed';letter-spacing:1.5px;padding:8px 16px;margin-top:12px;cursor:pointer;width:100%}
@media (max-width:980px){.wgrid{grid-template-columns:1fr}.w2,.w3{grid-column:auto} #wBoard .x{display:none}}
@media (max-width:640px){.wl{flex-wrap:wrap;gap:4px 8px}.wl .t{width:auto}.wl .what{flex-basis:100%} #wBoard .xs{display:none}}

/* Standings: the whole league, ESPN's record and the live season odds (DESIGN.md, "Standings"). */
body.stand>:not(#vStand):not(.views):not(script){display:none!important} #vStand{display:none} body.stand #vStand{display:block}
#sTab{margin-top:16px} #sTab th,#sTab td{padding:7px 8px} #sTab th:nth-child(2),#sTab td:nth-child(2){text-align:left}
#sTab td:first-child{color:var(--mute);width:28px} #sTab td:nth-child(2){max-width:240px;font-weight:600;font-size:16px}
#sTab td{font-size:16px} #sTab td.o{width:96px} #sTab td.o i{font:500 12px Inter;font-style:normal;color:var(--mute);margin-left:6px;display:inline-block;min-width:24px;text-align:left}
#sTab tr.cut td{border-bottom:1px solid var(--mute)} #sTab tr.me td{color:var(--red)} #sTab tr.me td:first-child{color:var(--red)}
#sTab .bd{font:600 11px 'Barlow Condensed';letter-spacing:1.2px;padding:1px 6px;background:var(--ink);color:var(--bg)} #sTab .bd.x{background:var(--track);color:var(--mute)}
.own{color:var(--mute);font-weight:500} tr.me .own{color:inherit} #sTab td.wkp{color:var(--mute)} #sTab td,#sTab th{white-space:nowrap} #sTab td:nth-child(2){white-space:normal}
@media (max-width:640px){#sTab .own{display:block;font-size:13px} #sTab .xs{display:none} #sTab th,#sTab td{padding:6px 4px} #sTab td.o{width:auto} #sTab td.o i{display:none} #sTab td:nth-child(2){max-width:120px}}
</style></head><body>
<nav class="views" role="tablist"><button data-v="scores" class="on">SCORES</button><button data-v="stand">STANDINGS</button><button data-v="wire">WIRE<span class="dot off" id="wdot"></span></button><button data-v="chat">CHAT<span class="dot off" id="unread"></span></button></nav>
<div class="top">
 <div class="team"><img class="logo" id="meL" alt=""><div><div class="tn" id="meN">–</div><div class="proj" id="meP"></div></div><div class="sc" id="meS" style="margin-left:auto">–</div></div>
 <div class="mid"><div class="half a" id="p">–</div><div class="half b" id="pb">–</div><div class="tug"><span id="tug"></span></div><small id="pl">WIN PROB</small></div>
 <div class="team r"><div class="sc" id="opS">–</div><div style="margin-left:auto"><div class="tn" id="opN">–</div><div class="proj" id="opP"></div></div><img class="logo" id="opL" alt=""></div>
</div>
<div class="chyron"><div class="tag" id="kick">WEEK –</div><div class="txt" id="h1">Loading the lineup model…</div></div>
<div class="dek" id="dek"></div><div class="err" id="err"></div>
<div class="ticker" id="ticker" role="tablist" aria-label="Matchups this week"></div>
<div class="grid">
 <div class="card"><h3 id="meH"></h3><div id="meR"></div></div>
 <div class="card"><h3 id="opH"></h3><div id="opR"></div></div>
 <div class="card" style="grid-row:span 2"><h3>Season outlook</h3><div class="kv" id="kv"></div><table id="season"></table>
  <div class="foot" id="sfoot"></div></div>
 <div class="card wide"><h3>Win probability, week <span id="wk"></span></h3>
  <div id="wp"><svg id="wpsvg" viewBox="0 0 860 220" width="100%" role="img" aria-label="Win probability over the week"></svg><div id="tip"></div></div>
  <div class="lg"><i style="background:var(--red)"></i>banked <i style="background:repeating-linear-gradient(45deg,var(--red) 0 2px,transparent 2px 6px)"></i>expected remaining · <span id="wplg"></span></div></div>
 <div class="card wide" id="noteC" hidden><h3>What would change this</h3><div class="note" id="note"></div></div>
</div>

<div class="card"><table id="sTab"></table><div class="foot" id="sFoot"></div></div>
</div>

<div class="chyron"><div class="tag" id="wTag">THE WIRE</div><div class="txt" id="wHead">Reading the league…</div></div>

</div></div>

<script>
const $=id=>document.getElementById(id), f1=x=>(+x).toFixed(1), f2=x=>(+x).toFixed(2), pct=x=>Math.round(x*100)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function Phi(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
const last=n=>n.split(' ').slice(-1)[0];
function names(rs){const n=rs.map(r=>last(r.name));if(!n.length)return'';if(n.length>3)return n.length+' players';return n.length<3?n.join(' and '):n.slice(0,2).join(', ')+' and '+n[2]}
function bars(rows,col){return rows.map(r=>{const b=Math.max(r.bank,0),wb=b/30*100,wr=r.rem/30*100;
 const tag=r.state==='live'?`<em class="live">${r.team} ${esc(r.opp)} · LIVE · ${Math.round((1-r.left)*100)}% PLAYED</em>`:`<em>${r.team} ${esc(r.opp)} · ${r.state==='upcoming'?esc(r.kick):'FINAL'}</em>`;
 return `<div class="prow" title="${esc(r.name)}: ${f1(r.bank)} banked, ${f1(r.rem)} expected left"><span class="slot">${r.slot}</span>
 <span class="pn">${esc(r.name)}${r.jersey?`<span class="jn">#${esc(r.jersey)}</span>`:''}${r.status?' ('+esc(r.status[0])+')':''}${tag}</span>
 <span class="bar"><span class="seg" style="width:${wb}%;background:${col}"></span><span class="seg" style="width:${wr}%;background:repeating-linear-gradient(45deg,${col} 0 2px,transparent 2px 6px);outline:1px solid ${col};outline-offset:-1px"></span></span>
 <span class="num">${f2(r.bank)}${r.rem?` <b>+${f1(r.rem)}</b>`:''}</span></div>`}).join('')}
function chart(h,V){const W=860,H=220,L=150,R=16,T=12,B=24,s=$('wpsvg');
 const ink='#8B9099',rule='#262A31',red='#E5383B',steel='#C9C2B8',txt='#F2F2F0';
 const ts=h.map(d=>Date.parse(d.t)),t0=ts[0],t1=Math.max(ts[ts.length-1],t0+60e3);
 const x=t=>L+(t-t0)/(t1-t0)*(W-L-R),y=p=>T+(1-p)*(H-T-B),mid=y(.5);
 const fmt=t=>new Date(t).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'});
 // Both sides on one scale: the left team's chance runs up from the 50% line,
 // the right team's runs down from it, so the line reads as a tug of war.
 let g=`<defs><clipPath id="cA"><rect x="${L}" y="${T}" width="${W-L-R}" height="${mid-T}"/></clipPath><clipPath id="cB"><rect x="${L}" y="${mid}" width="${W-L-R}" height="${H-B-mid}"/></clipPath></defs>`;

function evLine(e){const me=e.team_id===W.me,t=tm(e.team_id);let bd='',what='',hot=false;

 else if(e.kind==='drop'){bd='DROP';what=pn(e.player_id)+(e.how==='trade'?' <em>to make room in a trade</em>':'')}
 else if(e.kind==='claim_failed'){bd='CLAIM LOST';what=pn(e.player_id)+` <em>${esc(FAIL[e.detail]||e.detail||'failed')}</em>`}
 else if(e.kind==='claim_canceled'){bd='CANCELED';what=pn(e.player_id)+' <em>claim withdrawn</em>'}
 else if(e.kind==='trade'){bd='TRADE';what=`${pn(e.player_id)} <em>to ${esc(tm(e.other_team_id).name)}</em>`}
 else if(e.kind==='trade_accepted'){bd='ACCEPTED';hot=true;what=`${pn(e.player_id)} <em>to ${esc(tm(e.other_team_id).name)}, into the veto review</em>`}
 else if(e.kind==='vote'){bd='VOTE';what=`<em>voted to ${esc(e.detail)} a trade</em>`}
 else if(e.kind==='offer'){bd='OFFER';what=`<em>to ${esc(tm(e.other_team_id).name)}, ${esc(e.detail)}</em>`+((e.items||[]).length?': '+e.items.map(i=>`${pn(i.player_id)} <em>${esc(tm(i.from).abbrev)}&gt;${esc(tm(i.to).abbrev)}</em>`).join(', '):'')}
 else if(e.kind==='offer_declined'){bd='DECLINED';what='<em>declined a trade offer</em>'}
 else if(e.kind==='lineup'){bd='LINEUP';what=`${pn(e.player_id)} <em>${esc(e.detail||'')}${e.auto?', carried out by ESPN from a plan':''}</em>`}
 else if(e.kind==='lineup_plan'){bd='PLAN';what=`<em>set the week ${esc(e.for_week)} lineup in advance (${(e.items||[]).length} move${(e.items||[]).length===1?'':'s'})</em>`}
 return `<div class="wl"><span class="t">${at(e.at)}</span><span class="who${me?' me':''}">${logo(e.team_id,'xs')}${esc(t.abbrev||t.name)}</span><span class="bd${me?' me':hot?' hot':''}">${bd}</span><span class="what">${what}</span></div>`}
function wantEv(e){const k=WKINDS[WF.kind];if(WF.team&&e.team_id!==+WF.team&&e.other_team_id!==+WF.team)return false;if(!k)return e.kind!=='lineup'&&e.kind!=='lineup_plan';return k.includes(e.kind)||k.includes(e.kind+':'+e.how)}
function renderWire(){if(!W)return;const A=W.analysis,mine=tm(W.me),now=Date.now();
 const rival=W.events.filter(e=>e.team_id!==W.me&&e.kind!=='lineup');const fresh=rival.filter(e=>(e.at||0)>wseen).length,dot=$('wdot');dot.classList.toggle('off',!fresh||document.body.classList.contains('wire'));dot.textContent=fresh;
 const last48=rival.filter(e=>now-(e.at||0)<48*36e5),review=W.pending.filter(p=>p.direction==='league');
 $('wTag').textContent=`WEEK ${W.week} · PICK ${mine.priority??'-'} OF ${W.teams.length}`;
 $('wHead').textContent=review.length?`${review.length} trade${review.length>1?'s':''} in the veto review`:last48.length?`${last48.length} rival move${last48.length>1?'s':''} in the last 48 hours`:'No rival moves in the last 48 hours';
 $('wDek').textContent=`Every team's adds, drops, claims and trades, live from ESPN as of ${new Date(W.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}. ${A?`MIST's read from ${at(A.at)} (the Mac rebuilds it hourly).`:'MIST\'s read arrives with the next Mac snapshot.'} Other teams' open claims and offers are private on ESPN; they show here once they end.`;
 // In flight: ours, then the league's trades in review
 const wr=A?Object.fromEntries((A.wire||[]).map(w=>[w.player_id,w])):{};
 $('wPend').innerHTML=W.pending.map(p=>{const tr=p.type.startsWith('TRADE');
  const items=tr?p.items.filter(i=>i.type==='TRADE').map(i=>`${pn(i.player_id)} <em>${esc(tm(i.from).abbrev)}&gt;${esc(tm(i.to).abbrev)}</em>`).join(', '):p.items.map(i=>`${i.type==='ADD'?'+':'-'}${pn(i.player_id)}`).join(' &nbsp;');
  const add=p.items.find(i=>i.type==='ADD'),w=add&&wr[add.player_id];
  const odds=w&&w.lands!=null?` · lands about ${Math.round(w.lands*100)}%`:'';
  const lab=p.direction==='league'?'IN REVIEW':tr?(p.direction==='out'?'OFFER SENT':'OFFER IN'):'CLAIM'+(p.order!=null?' #'+(p.order+1):'');
  const when=p.direction==='league'?`veto review ends ${at(p.process_at)}`:tr?`expires ${at(p.expires_at)}`:`processes ${at(p.process_at)}${odds}`;
  return `<div class="pend"><span class="bd${p.direction==='league'?' lg':''}">${lab}</span><b>${items}</b><small>${when}</small></div>`}).join('')||'<div class="empty">Nothing in flight.</div>';
 $('wRead').innerHTML=A&&A.brief?A.brief.map(l=>`<p>${esc(l).replace(/^([^:]+:)/,'<b>$1</b>')}</p>`).join(''):'<div class="empty">No analysis yet.</div>';
 // On waivers
 $('wWire').innerHTML=A&&(A.wire||[]).length?A.wire.map(w=>{const r=(A.base_rates||{})[w.pos]||[0,0],need=w.need_teams.map(id=>esc(tm(id).name)).join(', ');
  const odds=w.class==='recycled'?`dropped${w.dropped_by?' by '+esc(tm(w.dropped_by).name):''}; this league claimed ${r[0]} of ${r[1]} dropped ${esc(w.pos)}s off waivers`:'never dropped here: a breakout draws rival claims';
  return `<div class="pend">${w.ours?'<span class="bd">OUR CLAIM</span>':''}<b>${esc(w.name)}</b> <span class="wpos">${w.pos==='D/ST'?'':esc(w.pos)+' · '+esc(w.nfl)+' · '}${f1(w.rate)} a week</span><small>${odds}. Clears ${at(w.clears)}.${need?' Need at '+esc(w.pos)+': '+need+'.':''}${w.lands!=null?` Lands about ${Math.round(w.lands*100)}%.`:''}</small></div>`}).join(''):'<div class="empty">Nobody on waivers worth a look.</div>';
 // Board
 const B=A?Object.fromEntries(A.board.map(b=>[b.team_id,b])):{};
 const rows=[...W.teams].sort((a,b)=>(a.priority??99)-(b.priority??99));
 const need=b=>{if(!b)return'<i>-</i>';const n=(b.needs||[]).map(x=>`${esc(x)} now`),x=(b.needs_next||[]).map(x=>`${esc(x)} wk ${W.week+1}`);return [...n,...x].join(', ')||'<i>covered</i>'};
 $('wBoard').innerHTML='<thead><tr><th>#</th><th>TEAM</th><th class="xs">W-L</th><th style="text-align:left">NEEDS</th><th class="x">TIER</th><th class="x">ADDS</th><th class="x">K/DST</th><th class="xs">SEEN</th></tr></thead><tbody>'+rows.map(t=>{const b=B[t.id];
  return `<tr data-team="${t.id}" class="${t.mine?'me':''}${String(t.id)===WF.team?' pick':''}"><td>${t.priority??'-'}</td><td>${logo(t.id,'xs')}${esc(t.name)}</td><td class="xs">${esc(t.record)}</td><td class="nd">${need(b)}</td><td class="x">${esc((b&&b.tier)||'-')}</td><td class="x">${b?b.adds:'-'}</td><td class="x">${b?b.kdst_adds:'-'}</td><td class="xs">${since(t.last_seen)}</td></tr>`}).join('')+'</tbody>';
 $('wBfoot').textContent='# is waiver priority: 1 claims first, and the order resets each week to the reverse of the standings. NEEDS is a starter slot the bench cannot cover, this week or next (a bye, OUT, IR, or empty). TIER and the adds are from the season record. SEEN is the last move made by hand. Tap a team for its moves.';
 // History
 $('wChips').innerHTML=Object.keys(WKINDS).map(k=>`<button data-k="${k}" class="${WF.kind===k?'on':''}">${k.toUpperCase()}</button>`).join('')+`<select id="wTeam"><option value="">All teams</option>${rows.map(t=>`<option value="${t.id}"${String(t.id)===WF.team?' selected':''}>${esc(t.name)}</option>`).join('')}</select>`;
 $('wTeam').onchange=e=>{WF.team=e.target.value;WF.show=60;renderWire()};
 const all=W.events.filter(wantEv),ev=all.slice(0,WF.show);let wk=null,out='';
 for(const e of ev){if(e.week!==wk){wk=e.week;out+=`<div class="wk">${wk?'WEEK '+wk:'DRAFT DAY'}</div>`}out+=evLine(e)}
 if(all.length>ev.length)out+=`<button class="more" id="wMore">SHOW ${Math.min(100,all.length-ev.length)} MORE OF ${all.length-ev.length}</button>`;
 $('wHist').innerHTML=out||'<div class="empty">No moves match.</div>';
 if($('wMore'))$('wMore').onclick=()=>{WF.show+=100;renderWire()};
 if(document.body.classList.contains('wire')){wseen=Math.max(wseen,...rival.map(e=>e.at||0),0);localStorage.setItem('sb-wire-seen',String(wseen))}}
$('wChips').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;WF.kind=b.dataset.k;WF.show=60;if(WF.kind==='lineups'&&!WF.lineups){WF.lineups=true;await loadWire()}renderWire()});
$('wBoard').addEventListener('click',e=>{const r=e.target.closest('tr[data-team]');if(!r)return;WF.team=WF.team===r.dataset.team?'':r.dataset.team;WF.show=60;renderWire();$('wHist').scrollIntoView({behavior:'smooth',block:'start'})});
async function loadWire(){try{const d=await get('/api/wire'+(WF.lineups?'?lineups=1':''));if(d.ok===false)throw new Error(d.error);W=d;$('wErr').textContent='';renderWire()}catch(e){$('wErr').textContent='Wire not reachable ('+e.message+'). Showing the last good reading.'}}
let wtick=0;setInterval(()=>{if(document.hidden)return;if(document.body.classList.contains('wire')||++wtick%5===0)loadWire()},60e3);loadWire();
function fromHash(){const h=new URLSearchParams(location.hash.slice(1));
 // The app opens a tapped push as v=chat&t=<topic>; a trade-in-review push carries the topic "wire".
 if(h.get('v')==='stand'){setView('stand');return}
 if(h.get('v')==='wire'||(h.get('v')==='chat'&&h.get('t')==='wire')){setView('wire');return}
 if(h.get('v')==='chat'){setView('chat');const t=h.get('t');if(t){const go=()=>C?openThread(t):setTimeout(go,300);go()}}}
fromHash();window.addEventListener('hashchange',fromHash);
</script></body></html>
